// ---------------------------------------------------------------------------
// Проигрыш «на волоске»: шестой капельке некуда встать — она шлёпается о полку, капельки на полке оседают лужицами и брызжут,
// в замедлении падает последняя капля. Потом — «ещё одно место» на полке (заглушка) и карточка.
// ---------------------------------------------------------------------------
function startLose(t){
  const E = G.end = { kind: 'lose', r0: realNow(), step: 0 };
  const W = G.wv.get(G.loseTrav);
  if (W){ W.mode = 'lost'; E.off = W; E.from = [W.x, W.y, W.z]; }
  Sfx.setSpin(0); Sfx.lose();
  log('fx.start', 'lose.spill');
}
function runLose(t){
  const E = G.end, s = seqT(), cz = CFG.slotZ;
  if (E.off && s < 0.24){ const u = clamp01(s / 0.22), W = E.off; W.x = mix(E.from[0], 0.4, u); W.z = mix(E.from[2], cz - 1.9, u); W.y = Math.sin(Math.PI * u) * 1.4; }
  if (E.step === 0 && s >= 0.22){
    E.step = 1; setSlow(CFG.loseSlow); buzz(CFG.vib.lose);
    const fallen = G.st.slots.map(tr => G.wv.get(tr)).filter(Boolean); if (E.off) fallen.push(E.off);
    const kinds = []; let budget = CFG.loseSprayMax;
    fallen.forEach((W, i) => {
      W.burst = { t0: t + i * 0.035 }; const tp = W.burst.t0 + CFG.burstT;
      const n = Math.min(budget, Math.min(6, Math.max(3, shownCount(W)))); budget -= n;
      for (let k = 0; k < n; k++){ const b = fxRnd() * TAU, sp = 2 + fxRnd() * 4.5;
        G.spray.push({ x: W.x, y: 0.6, z: W.z, vx: Math.cos(b) * sp, vy: 5 + fxRnd() * 6, vz: Math.sin(b) * sp * 0.6 + 0.8, r: 0.16 + fxRnd() * 0.12, col: COL.paint[W.kind], t0: tp, life: 2.4, floor: 0.12 }); kinds.push(W.kind); }
    });
    E.heroKind = E.off ? E.off.kind : 0; E.heroAt = t + Math.sqrt(2 * 5.6 / 32);       // последняя капля: падает с высоты 5,7 на полку
    G.spray.push({ x: 0.3, y: 5.7, z: cz - 0.4, vx: 0, vy: 0, vz: 0, r: 0.4, col: COL.paint[E.heroKind], t0: t, life: 3, floor: 0.14, keep: true });
    Sfx.spill(kinds.slice(0, 12), CFG.burstT); log('fx.start', 'lose.lastdrop');
  }
  if (E.step === 1 && t >= E.heroAt){ E.step = 2; E.s2 = s; Sfx.plip(E.heroKind, 0, 1.2); buzz(CFG.vib.pixel);
    G.fx.push({ type: 'ring', x: 0.3, y: 0.1, z: cz - 0.4, t0: t, dur: 0.4, r0: 0.3, r1: 2.2, col: PAL.paint[E.heroKind], a: 0.9 });
    for (let k = 0; k < 7; k++){ const a = fxRnd() * TAU; G.fx.push({ type: 'bead', x: 0.3, y: 0.2, z: cz - 0.4, vx: Math.cos(a) * 80, vy: Math.sin(a) * 50 - 60, t0: t, dur: 0.4, size: 0.14, col: PAL.paint[E.heroKind] }); }
    log('fx.end', 'lose.lastdrop'); }
  if (E.step === 2 && s >= E.s2 + 0.45){ E.step = 3; setSlow(1); log('fx.end', 'lose.spill'); goto('lose'); }
}

// ---------------------------------------------------------------------------
// Кадр: подача предметов в сцену (assets/scene3d.js) и 2D-слой поверх (числа, брызги, цель, название картинки)
// ---------------------------------------------------------------------------
// Клетки картинки. Незакрашенная — стоячий блок в своём цвете (метки нет с v0.4.1); краска разливается от центра к краям, клетка оседает;
// готовый пиксель — плоский, целиком своего цвета.
function drawTiles(t){
  const h = L.h, H = CFG.tileH * h, PH = CFG.pixelH * h, ps = h * CFG.pixelH / CFG.tileH, intro = t - G.introAt < 3.5, E = G.end && G.end.kind === 'win' ? G.end : null, B = CFG.look !== 'A', RAW = CFG.look === 'B';   // В: закрашенное — как Б, незакрашенное — как А
  if (CFG.rise) return drawSculpt(t, h, H, intro, E);
  for (const vp of G.vp.values()){
    let y0 = 0, pop = 1;
    if (intro){ const iu = (t - G.introAt - vp.delay) / CFG.introDropT; if (iu <= 0) continue; if (iu < 1) y0 = (1 - iu) * (1 - iu) * 5; else pop = 1 + 0.2 * spring(t - G.introAt - vp.delay - CFG.introDropT, 30, 9); }
    const col = COL.paint[vp.kind], blank = RAW ? COL.rawTop[vp.kind] : COL.blank[vp.kind];
    if (vp.state === 'pixel'){
      const d = t - vp.doneAt; let lift = 0, glow = Math.max(0, 1 - d / 0.25) * 0.45, s = CFG.pixelGrow * (1 + (d < 0.6 ? CFG.clickSquash * spring(d, 30, 8) : 0));
      const fl = t - vp.flashAt; if (fl > 0 && fl < 0.3){ glow = Math.max(glow, (1 - fl / 0.3) * 0.7); lift = Math.sin(Math.PI * fl / 0.3) * 0.25 * h; }       // весь цвет закрашен: вспышка бежит по его пикселям
      if (E){                                                  // финал: картинка приподнята, по ней бежит волна, потом она «дышит»
        lift = CFG.winLift * E.f; const sw = E.s - CFG.winWaveAt - vp.wr * CFG.winWavePer;
        if (sw > 0 && sw < 0.34){ const k = Math.sin(Math.PI * sw / 0.34);   // А: волна возвращает цвет (подскок, раздувание); Б: короткий блик бежит по яркой картинке
          if (B){ lift += k * CFG.winHop * 0.4; glow = Math.max(glow, k * 0.55); s *= 1 + 0.1 * k; } else { lift += k * CFG.winHop; glow = Math.max(glow, (1 - sw / 0.34) * 0.8); s *= 1 + 0.28 * k; } }
        if (sw > 0 && !vp.waved){ vp.waved = true; if (fxRnd() < 0.16) G.fx.push({ type: 'glint', x: vp.x, y: CFG.winLift + 0.6, z: vp.z, t0: t, dur: 0.38, size: 0.55, col: fxRnd() < 0.5 ? '#ffffff' : PAL.paint[vp.kind] }); }   // волна зажигает картинку: пиксель вспыхивает полным цветом, кое-где искра
        if (E.s > E.flashS){ glow = Math.max(glow, Math.max(0, 1 - (E.s - E.flashS) / 0.5) * 0.85); lift += 0.06 * Math.sin((E.s - E.flashS) * 2.6 - vp.wr * 0.7); }
      } else { const sh = ((t * 0.5 + (vp.x + vp.z) * 0.045) % 3.2); if (sh < 0.16) glow = Math.max(glow, Math.sin(Math.PI * sh / 0.16) * 0.16); }   // редкий блик бежит по готовым пикселям
      if (vp.lit || d < 0.4){ const e = Math.max(0, 1 - d / 0.35); R3.cellGlow(vp.i, e * 0.9); vp.lit = e > 0; }   // клетка холста вспыхивает под лёгшим пикселем
      // до конца картинки закрашенное — «пол» почти цвета холста (не спорит с тем, что ещё красить); на финале волна возвращает полный цвет
      let dim = clamp01((d - 0.12) / CFG.dimT); if (fl > 0 && fl < 0.45) dim = Math.min(dim, fl / 0.45);
      if (E){ const sw = E.s - CFG.winWaveAt - vp.wr * CFG.winWavePer; dim = sw > 0 ? 0 : 1; }
      if (B) dim = 0;                                                    // вид Б: закрашенное — награда, сразу в полном цвете
      const pc = dim >= 1 ? COL.paintDim[vp.kind] : dim > 0 ? mix3(col, COL.paintDim[vp.kind], dim) : col, seam = dim >= 1 ? COL.floorSeam : dim > 0 ? mix3(pc, COL.floorSeam, dim) : null;
      R3.tile(vp.x, PH / 2 + y0 + lift, vp.z, null, h * s, ps, pc, 0, null, glow, seam, null, pc, B ? 2 : 1);
      continue;
    }
    if (vp.state === 'fill'){                                  // краска разливается от центра к краям, клетка оседает в пиксель
      const u = clamp01((t - vp.fillAt) / CFG.fillT), e = easeOut(u), sy = mix(h, ps, easeIn(u));
      R3.tile(vp.x, mix(H, PH, easeIn(u)) / 2 + y0, vp.z, null, h * mix(1, CFG.pixelGrow, e) * (1 + 0.1 * Math.sin(Math.PI * u)), sy, blank, mix(CFG.fillR0, 1.5, e), col, 0.35 * (1 - u), null, null, col, 0);
      continue;
    }
    const bu = (t - vp.bumpAt) / CFG.rippleT; if (bu > 0 && bu < 1) y0 += Math.sin(Math.PI * bu) * CFG.rippleHop * h;      // сосед только что закрашен
    // достижимая клетка (краска до неё уже долетает) стоит выше и со светлой кромкой; открылась — подпрыгнула; зажата капелька её цвета — кромка пульсирует
    let sy = pop * (vp.reach ? 1 : CFG.farH), rimA = 0;
    if (vp.reach){ const ra = t - vp.reachAt; sy *= 1 + CFG.reachLift * (ra < 0.5 ? 1 + 1.4 * spring(ra, 24, 7) : 1); rimA = CFG.reachRim;
      if (G.peek === vp.kind) rimA = mix(CFG.reachRim, CFG.peekRim, 0.5 + 0.5 * Math.sin(t * 9)); }
    const rim = rimA <= 0 ? null : rimA === CFG.reachRim ? (RAW ? COL.rawRim : COL.blankRim)[vp.kind] : mix3(blank, COL.white, rimA);   // постоянная кромка — из кэша (без аллокаций в кадре)
    const top = vp.reach ? blank : RAW ? COL.rawFarTop[vp.kind] : COL.blankFar[vp.kind], side = RAW ? (vp.reach ? COL.rawSideC[vp.kind] : COL.rawFarSide[vp.kind]) : vp.reach ? col : COL.farSide[vp.kind];
    R3.tile(vp.x, H / 2 * sy + y0, vp.z, null, h * pop, h * sy, top, 0, col, G.peek === vp.kind && vp.reach ? 0.12 : 0, rim, null, side, 0);
    if (y0 < 2) R3.shadow(vp.x, vp.z, CFG.tileR * 1.3 * h, vp.reach ? (RAW ? 0.65 : 0.5) : 0.3);
  }
  for (const S of G.stones){                                   // камни: не красятся, краска к ним липнет; в финале уходят в холст, остаётся картинка
    let y0 = 0, sc = 1;
    if (intro){ const iu = (t - G.introAt - S.delay) / CFG.introDropT; if (iu <= 0) continue; if (iu < 1) y0 = (1 - iu) * (1 - iu) * 5; }
    if (E){ const k = clamp01((E.s - 0.1) / 0.5); sc = 1 - easeIn(k); if (sc <= 0.02) continue; }
    const sy = CFG.stoneH * (0.92 + 0.16 * S.ph) * sc, top = COL.stoneTop, side = COL.stoneSide;
    R3.tile(S.x, H / 2 * sy + y0, S.z, null, h * (0.96 + 0.06 * S.ph) * Math.max(0.3, sc), h * sy, top, 0, side, 0, COL.stoneRim, null, side, 0);
    if (y0 < 2) R3.shadow(S.x, S.z, CFG.tileR * 1.35 * h, 0.55 * sc);
  }
}

// Вид В v0.2 «скульптура»: закрашенная клетка поднимается высоким ярким блоком (момент попадания — подъём из пола с отскоком,
// вспышка, волна соседям), незакрашенные — плоские пастельные плитки; край пятна — плоский, но яркий: почти полный цвет, светлая кромка,
// лёгкий пульс свечения; дальние — тихая пастель. Камни — тёмные матовые, ниже скульптуры. Затекание — медленнее, блок поднимается волной.
function drawSculpt(t, h, H, intro, E){
  const RH = CFG.riseH, FH = CFG.flatH, FR = CFG.flatReach;
  for (const vp of G.vp.values()){
    let y0 = 0, pop = 1;
    if (intro){ const iu = (t - G.introAt - vp.delay) / CFG.introDropT; if (iu <= 0) continue; if (iu < 1) y0 = (1 - iu) * (1 - iu) * 5; else pop = 1 + 0.2 * spring(t - G.introAt - vp.delay - CFG.introDropT, 30, 9); }
    const col = COL.paint[vp.kind];
    if (vp.state === 'pixel'){
      const d = t - vp.doneAt; let lift = 0, glow = Math.max(0, 1 - d / 0.3) * 0.5, hy = RH * pop, s = CFG.pixelGrow * 0.97;
      if (d < 0.7){ const k = spring(d, 26, 7); hy *= 1 + CFG.riseOver * k; s *= 1 - 0.12 * k; }                 // отскок подъёма: растяжение вверх, сжатие в ширину
      const fl = t - vp.flashAt; if (fl > 0 && fl < 0.3){ glow = Math.max(glow, (1 - fl / 0.3) * 0.6); lift = Math.sin(Math.PI * fl / 0.3) * 0.25 * h; }   // цвет закрашен целиком: вспышка бежит по его блокам
      if (E){                                                  // финал: скульптура приподнята, по ней бежит волна-блик, потом вспышка и «дыхание»
        lift = CFG.winLift * E.f; const sw = E.s - CFG.winWaveAt - vp.wr * CFG.winWavePer;
        if (sw > 0 && sw < 0.34){ const k = Math.sin(Math.PI * sw / 0.34); lift += k * CFG.winHop * 0.45; glow = Math.max(glow, k * 0.6); hy *= 1 + 0.25 * k; }
        if (sw > 0 && !vp.waved){ vp.waved = true; if (fxRnd() < 0.16) G.fx.push({ type: 'glint', x: vp.x, y: CFG.winLift + RH * H + 0.4, z: vp.z, t0: t, dur: 0.38, size: 0.55, col: fxRnd() < 0.5 ? '#ffffff' : PAL.paint[vp.kind] }); }
        if (E.s > E.flashS){ glow = Math.max(glow, Math.max(0, 1 - (E.s - E.flashS) / 0.5) * 0.85); lift += 0.06 * Math.sin((E.s - E.flashS) * 2.6 - vp.wr * 0.7); }
      } else { const sh = ((t * 0.5 + (vp.x + vp.z) * 0.045) % 3.2); if (sh < 0.16) glow = Math.max(glow, Math.sin(Math.PI * sh / 0.16) * 0.16); }   // редкий блик бежит по скульптуре
      if (vp.lit || d < 0.4){ const e = Math.max(0, 1 - d / 0.35); R3.cellGlow(vp.i, e * 0.9); vp.lit = e > 0; }
      R3.tile(vp.x, H * hy / 2 + y0 + lift, vp.z, null, h * s, h * hy, col, 0, null, glow, null, null, col, 2);
      if (y0 < 2) R3.shadow(vp.x, vp.z, CFG.tileR * 1.3 * h, 0.55);
      continue;
    }
    if (vp.state === 'fill' && CFG.well){                      // v0.3: краска заливает лунку, из неё вырастает блок (затекание — лунка наливается сама, медленно)
      const T = fillDur(vp), tp = vp.sealed ? T * 0.55 : CFG.pourT, f = t - vp.fillAt;
      if (f < tp){ const u = clamp01(f / tp);
        R3.tile(vp.x, H * CFG.wellH / 2 + y0, vp.z, null, h * (1 + 0.06 * Math.sin(Math.PI * u)), h * CFG.wellH, COL.wellLip[vp.kind], 0.04 + 0.52 * (vp.sealed ? easeInOut(u) : easeOut(u)), col, 0.25 * u, COL.wellRim[vp.kind], null, COL.wellIn[vp.kind], -1);
        continue; }
      const u = clamp01((f - tp) / (T - tp)), r = vp.sealed ? easeInOut(u) : easeOut(u), hy = mix(CFG.wellH, RH, r);
      R3.tile(vp.x, H * hy / 2 + y0, vp.z, null, h * mix(1, CFG.pixelGrow * 0.97, r) * (1 + 0.08 * Math.sin(Math.PI * u)), h * hy, col, 0, null, 0.4 * (1 - u), null, null, col, 2);
      if (y0 < 2) R3.shadow(vp.x, vp.z, CFG.tileR * 1.3 * h, 0.3 + 0.25 * r);
      continue;
    }
    if (vp.state === 'fill'){                                  // краска растекается по плитке, блок вырастает из пола (затекание — медленнее, волной)
      const T = fillDur(vp), u = clamp01((t - vp.fillAt) / T), e = easeOut(u), r = vp.sealed ? easeInOut(clamp01((u - 0.35) / 0.65)) : easeIn(u);
      const hy = mix(FR, RH, r), top = vp.sealed ? COL.cFar[vp.kind] : COL.cEdge[vp.kind];
      R3.tile(vp.x, H * hy / 2 + y0, vp.z, null, h * mix(1, CFG.pixelGrow * 0.97, e) * (1 + 0.08 * Math.sin(Math.PI * u)), h * hy, top, mix(vp.sealed ? 0.05 : CFG.fillR0, 1.5, vp.sealed ? easeInOut(Math.min(1, u * 1.6)) : e), col, 0.4 * Math.sin(Math.PI * u), null, null, col, 0);
      if (y0 < 2) R3.shadow(vp.x, vp.z, CFG.tileR * 1.3 * h, 0.3 + 0.25 * r);
      continue;
    }
    const bu = (t - vp.bumpAt) / CFG.rippleT; if (bu > 0 && bu < 1) y0 += Math.sin(Math.PI * bu) * CFG.rippleHop * h;      // волна соседям: сосед только что поднялся
    if (vp.reach && CFG.well){                                 // край пятна v0.3: лунка в полу; стала краем — плитка проседает в неё с бликом
      const ra = t - vp.reachAt;
      if (ra >= 0 && ra < CFG.sinkT){ const k = easeIn(ra / CFG.sinkT), hy = mix(FH, CFG.wellH, k) * pop;
        R3.tile(vp.x, H * hy / 2 + y0, vp.z, null, h * pop * 0.96, h * hy, COL.pale[vp.kind], 0, col, 0.25 * k, null, null, COL.paleSide[vp.kind], 0); continue; }
      const open = ra >= 0 && ra < 0.45 ? 1 - (ra - CFG.sinkT) / (0.45 - CFG.sinkT) : 0, bump = open > 0 ? 1 + 0.1 * spring(ra - CFG.sinkT, 30, 9) : 1;
      let rim = COL.wellRim[vp.kind], ra1 = rim ? 0.55 : 0;
      if (G.peek === vp.kind){ rim = COL.white; ra1 = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 9)); }
      R3.tile(vp.x, H * CFG.wellH / 2 + y0, vp.z, null, h * pop * bump, h * CFG.wellH, COL.wellLip[vp.kind], 0, col, 0.3 * Math.max(0, open), rim ? (ra1 === 0.55 ? rim : mix3(COL.wellLip[vp.kind], rim, ra1)) : null, null, COL.wellIn[vp.kind], -1);
      continue;

// Название готовой картинки: выскакивает над ней после вспышки.
function drawTitle(c, E){
  const s = E.s - E.flashS; if (s < 0 || G.screen !== 'win' && s < 0) return;
  const P = G.pic, p = R3.project(P.cx, CFG.winLift, P.cz - P.h / 2 - 1.4), pop = 1 + 0.4 * spring(s, 18, 6), y = Math.max(74, Math.min(p[1], 130));
  c.globalAlpha = clamp01(s / 0.12);
  drawLabel(c, LEVELS[G.li].n + '!', VW / 2, y, Math.min(40, VW * 0.9 / Math.max(6, LEVELS[G.li].n.length) * 1.5) * pop, '#ffffff', 'rgba(15,17,48,.9)');
  drawLabel(c, 'картинка ' + (G.li + 1) + ' из ' + LEVELS.length, VW / 2, y + 30, 14, PAL.accent, 'rgba(15,17,48,.9)');
  c.globalAlpha = 1;
}
function drawOverlay(t, r){
  const c = ctx, k = R3.pxPerUnit(), st = G.st, E = G.end && G.end.kind === 'win' ? G.end : null;
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, VW, VH);
  if (G.tension > 0.02){                                                 // тёплая виньетка: янтарь при 4/5, красная при 5/5
    const g = c.createRadialGradient(VW / 2, VH * 0.55, VH * 0.28, VW / 2, VH * 0.55, VH * 0.72), a = Math.min(1, G.tension) * 0.2 + Math.max(0, G.tension - 1) * 0.16;
    g.addColorStop(0, 'rgba(255,150,40,0)'); g.addColorStop(1, G.tension > 1.2 ? `rgba(255,70,60,${a})` : `rgba(255,160,50,${a})`);
    c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  }
  if (!st.ended) drawCapacity(c);
  // верёвочки связок
  const byLink = new Map();
  for (const W of G.wv.values()) if (W.src.link > 0 && W.mode !== 'gone'){ if (!byLink.has(W.src.link)) byLink.set(W.src.link, []); byLink.get(W.src.link).push(W); }
  for (const g of byLink.values()) for (let i = 1; i < g.length; i++) drawBand(c, g[i - 1], g[i], k);
  // хвосты летящих капель
  for (const m of G.shots) if (m.live && t >= m.t0){
    const a = R3.project(m.x, m.y, m.z), b = R3.project(m.x - (m.x - m.px) * 4.5, m.y - (m.y - m.py) * 4.5, m.z - (m.z - m.pz) * 4.5);
    const g = c.createLinearGradient(a[0], a[1], b[0], b[1]); g.addColorStop(0, PAL.paintA[m.kind]); g.addColorStop(1, PAL.paint0[m.kind]);
    c.strokeStyle = g; c.lineWidth = k * Math.max(CFG.dropMin, CFG.dropR * L.h) * 1.1; c.lineCap = 'round'; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  // подписи капелек
  const pulse = 1 + 0.16 * Math.sin(r / 1000 * TAU * 2.4);
  for (const W of G.wv.values()){
    if (W.burst || W.mode === 'gone') continue;
    const TB = R3.TUBE, w = W.yaw, Wl = { dx: W.dx, dy: W.dy, dz: W.dz, sxz: W.sxz, sy: W.sy, yaw: W.yawD === undefined ? w : W.yawD };
    const lp = tubePoint(Wl, TB.x0 + TB.labelU * TB.len, 0.92 * (1 - 0.5 * (W.flat || 0)) + 0.02, 0), p = R3.project(lp[0], lp[1], lp[2]);    // число — на этикетке
    let size = Math.max(12, k * 0.62 * W.sxz); p[1] += k * 0.16 * W.sxz;
    if (G.tension > 1.5 && W.mode === 'trav' && W.cnt > 0) size *= pulse;
    if (W.secret) drawLabel(c, '?', p[0], p[1], size * 1.05, PAL.ink, 'rgba(9,10,34,.6)');
    else if (W.cnt > 0) drawLabel(c, String(W.cnt), p[0], p[1], size, '#ffffff', PAL.labelEdge[W.kind]);
  }
  // эффекты
  const gp = goalPose();
  for (let i = G.fx.length - 1; i >= 0; i--){
    const f = G.fx[i], u = (t - f.t0) / f.dur; if (u < 0) continue;
    if (u >= 1){ G.fx.splice(i, 1); continue; }
    const p = R3.project(f.x, f.y, f.z);
    if (f.type === 'glint') drawGlint(c, p[0], p[1], f.size * k * Math.sin(Math.PI * u) * 1.2, 1 - u * u, f.col);
    else if (f.type === 'spark'){ drawGlint(c, p[0] + f.vx * u * f.dur * 1.2, p[1] + f.vy * u * f.dur * 1.2 + 90 * u * u * f.dur, f.size * k * (1 - u), 1 - u, f.col); }
    else if (f.type === 'bead'){ const s = u * f.dur; c.fillStyle = f.col; c.beginPath(); c.arc(p[0] + f.vx * s, p[1] + f.vy * s + 420 * s * s, Math.max(0.5, f.size * k * (1 - u * u)), 0, TAU); c.fill(); }   // бусина краски: брызги от капли
    else if (f.type === 'ring'){ c.globalAlpha = (1 - u) * (f.a || 0.8); c.strokeStyle = f.col; c.lineWidth = 3.5 * (1 - u) + 1; c.beginPath(); const rr = mix(f.r0, f.r1, easeOut(u)) * k; c.ellipse(p[0], p[1], rr, rr * R3.SP(), 0, 0, TAU); c.stroke(); c.globalAlpha = 1; }
    else if (f.type === 'star') drawStar(c, p[0], p[1] - k * 0.6 * easeOut(u), f.size * k * (0.4 + 0.6 * Math.sin(Math.PI * Math.min(1, u * 1.4))), 1 - u * u, f.col, u * 1.2);
    else if (f.type === 'text'){ c.globalAlpha = u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3; const pop = 1 + 0.35 * spring(u * f.dur, 22, 9); drawLabel(c, f.txt, p[0], p[1] - k * 0.9 * easeOut(u), f.size * k * pop, f.col, 'rgba(9,10,34,.7)'); c.globalAlpha = 1; }
    else if (f.type === 'fly'){ const e = easeInOut(u), x = mix(p[0], gp.x, e), y = mix(p[1], gp.y, e) - Math.sin(Math.PI * u) * 46;          // искра пикселя летит в мини-картинку
      c.fillStyle = f.col; hexPath(c, x, y, mix(k * 0.5, 5, e)); c.fill(); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,.85)'; c.stroke(); }
  }
  drawGoal(c, t);
  if (E && E.s > E.flashS) drawTitle(c, E);
  if (G.hint && !st.ended){                                             // первый уровень: кольцо-подсказка на первых капельках
    const u = (r / 1000 * 1.1) % 1;
    for (let i = 0; i < st.columns.length; i++){ if (!st.columns[i].length) continue; const q = L.queue[i][0], p = R3.project(q[0], 0.7, q[1]);
      c.globalAlpha = 1 - u; c.strokeStyle = PAL.accent; c.lineWidth = 3; c.beginPath(); c.ellipse(p[0], p[1], k * (1.7 + u * 0.8), k * (1.7 + u * 0.8) * 0.86, 0, 0, TAU); c.stroke(); c.globalAlpha = 1; }
  }
}

// ---------------------------------------------------------------------------
// Ввод: Pointer Events, порог тап/драг, pointercancel = pointerup (§3)
// ---------------------------------------------------------------------------
const gameEl = $('game');
let down = null;
function pickTap(px, py){
  const k = R3.pxPerUnit(), rad = Math.max(CFG.tapMinPx, k * 1.45); let best = null, bd = rad;
  for (const W of G.wv.values()){
    if (W.mode !== 'queue' && W.mode !== 'slot') continue;
    const p = R3.project(W.dx, W.dy + 0.45 * W.sy, W.dz), d = Math.hypot(p[0] - px, p[1] - py);
    if (d < bd){ bd = d; best = W; }
  }
  return best;
}
gameEl.addEventListener('pointerdown', (e) => { Sfx.init(); const r = gameEl.getBoundingClientRect(); down = { x: e.clientX - r.left, y: e.clientY - r.top, id: e.pointerId }; try { gameEl.setPointerCapture(e.pointerId); } catch (err) {}
  const W = G.screen === 'game' && G.st ? pickTap(down.x, down.y) : null; G.peek = W && !W.secret ? W.kind : -1; });   // зажал капельку — подсвечены клетки, куда она попадёт
function onUp(e){
  if (!down || e.pointerId !== down.id) return;
  G.peek = -1;
  const r = gameEl.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, moved = Math.hypot(x - down.x, y - down.y) > CFG.tapSlop;
  down = null;
  if (moved || e.type === 'pointercancel' || G.screen !== 'game' || !G.st) return;
  const W = pickTap(x, y); if (!W) return;
  log('input', 'tap', W.mode === 'queue' ? 'col=' + W.col + ' row=' + W.row : 'slot=' + W.slot);
  if (W.mode === 'queue') tapColumn(W.col); else tapSlot(W.slot);
}
gameEl.addEventListener('pointerup', onUp); gameEl.addEventListener('pointercancel', onUp);
document.addEventListener('keydown', (e) => {                    // дубли на клавиатуру для отладки (§3)
  if (e.key >= '1' && e.key <= '5'){ Sfx.init(); tapColumn(+e.key - 1); }
  else if ('67890'.includes(e.key)){ Sfx.init(); tapSlot('67890'.indexOf(e.key)); }
  else if (e.key === 'r') startLevel(G.li);
  else if (e.key === 'm') goto('menu');
});
$('btn-reset').onclick = () => { Sfx.init(); log('input', 'button', 'reset'); startLevel(G.li); };
$('btn-menu').onclick = () => { Sfx.init(); log('input', 'button', 'menu'); goto('menu'); };

// --- размер: resize + orientationchange + периодический пересчёт (§2); DPR сам понижается, если кадр не держится ---
let dprCap = 2, fitKey = '';
function fit(){
  const r = gameEl.getBoundingClientRect(); if (!r.width || !r.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap), key = r.width + 'x' + r.height + '@' + dpr; if (key === fitKey) return; fitKey = key;
  DPR = dpr; VW = r.width; VH = r.height; fxc.width = Math.round(VW * DPR); fxc.height = Math.round(VH * DPR);
  R3.resize(VW, VH, DPR); if (G.screen === 'lose') placeRevive();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => { G.paused = document.hidden; reclock(); if (document.hidden){ Sfx.setRoll(0); Sfx.setSpin(0); } log('event', G.paused ? 'pause' : 'resume'); });

// --- цикл: rAF + сторож setInterval; безопасно, потому что время абсолютное (§4) ---
const perf = { dt: [], cpu: [], last: 0, slow: 0 };
let lastFrame = 0;
function tick(){
  const p0 = performance.now(), t = now();
  if (G.st && (G.screen === 'game' || G.screen === 'win' || G.screen === 'lose')){ advance(t); draw(t); }
  if (toastUntil && p0 > toastUntil){ $('toast').classList.add('hide'); toastUntil = 0; }
  perf.cpu.push(performance.now() - p0); if (perf.cpu.length > 240) perf.cpu.shift();
  if (!perf.firstGame && G.screen === 'game' && G.st){ perf.firstGame = performance.now(); perf.firstDraw = perf.firstGame - p0; }   // первый кадр игры: когда и сколько стоил (прогрев шейдеров)
}
function frame(){
  const p = performance.now();
  if (lastFrame){ const d = p - lastFrame; perf.dt.push(d); if (perf.dt.length > 240) perf.dt.shift();
    if (G.screen === 'game' && d < 200){ perf.slow = d > 21 ? perf.slow + 1 : Math.max(0, perf.slow - 2);
      if (perf.slow > 90 && dprCap > 1.25){ dprCap = Math.max(1.25, dprCap - 0.25); perf.slow = 0; fit(); log('event', 'dpr.down', dprCap); } } }
  lastFrame = p;
  if (!G.paused) tick();
  requestAnimationFrame(frame);
}
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) tick(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автоигра, замер кадра ---
window.RASKRASKA = {
  G, CFG, LEVELS, R3, Sfx, L,
  state(){
    const st = G.st; if (!st) return { screen: G.screen };
    return { screen: G.screen, level: G.li + 1, name: G.def.n, ended: st.ended, cells: st.center.size, seed: (G.def.s || []).length, stones: st.stones.size, sealed: st.sealed, pixels: G.pixDone, pixTotal: G.pixTotal, deposited: st.deposited, needed: st.needed,
             queue: st.columns.map(c => c.length), ring: st.travelers.length, slots: st.slots.length, shots: G.shots.length, fills: G.fills.length, spray: G.spray.length,
             score: Math.round(G.score), combo: G.combo.n, tension: +G.tension.toFixed(2), spin: +G.spin.toFixed(2), end: G.end ? G.end.kind + ':' + G.end.step : null, t: +now().toFixed(2) };
  },
  play(n){ startLevel(Math.max(1, Math.min(LEVELS.length, n || 1)) - 1); return this.state(); },
  tap(col){ return tapColumn(col); },
  slot(i){ return tapSlot(i); },
  goto(screen){ goto(screen); return G.screen; },
  solve(){ return G.def ? queuePlayable(G.def) : null; },
  ref(){ return G.def ? playout(G.def, refPolicy(G.def), 1) : null; },          // безголовый повтор эталонного прохождения уровня
  auto(mode, seed){ G.auto = mode === false || mode === 0 ? null : (mode === 'dumb' || mode === 'random' ? mode : 'greedy'); if (seed !== undefined) G.botRng = mulberry32(seed); return G.auto; },   // true — бот игры, 'random' — случайный, 'dumb' — транжира (проигрыш)
  drive(sec, draw3d){                              // ручной прогон времени кадрами по 1/60 с: rAF заморожен в скрытой вкладке
    const n = Math.round(sec * 60);
    for (let i = 0; i < n; i++){ Clock.off += 1000 / 60; const t = now(); if (G.st){ advance(t); if (draw3d !== false || i === n - 1) draw(t); } }
    return this.state();
  },
  speed(x){ G.speed = x || 1; reclock(); return G.speed; },
  look(x, y, z, half){ if (x === undefined){ G.look = false; R3.setView(0); } else { G.look = true; R3.look(x, y, z, half || 5); } if (G.st) draw(now()); return true; },   // крупный план (без аргументов — обратно)
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
  perf(){                                          // замер кадра: интервалы rAF и время своего кода за последние 240 кадров
    const s = perf.dt.slice().sort((a, b) => a - b), c = perf.cpu.slice().sort((a, b) => a - b), avg = s.reduce((a, b) => a + b, 0) / Math.max(1, s.length);
    return { frames: s.length, fps: +(1000 / avg).toFixed(1), avgMs: +avg.toFixed(2), p95Ms: +(s[Math.floor(s.length * 0.95)] || 0).toFixed(2), maxMs: +(s[s.length - 1] || 0).toFixed(2),
             over20: s.filter(x => x > 20).length, firstGameMs: Math.round(perf.firstGame || 0), firstDrawMs: +(perf.firstDraw || 0).toFixed(1), cpuAvgMs: +(c.reduce((a, b) => a + b, 0) / Math.max(1, c.length)).toFixed(2), cpuP95Ms: +(c[Math.floor(c.length * 0.95)] || 0).toFixed(2), dpr: DPR, scene: R3.stats() };
  },
  bench(frames){                                   // стоимость кадра без ожидания rAF: n кадров подряд, мс на кадр (свой код + отправка в GPU)
    const n = frames || 120, p0 = performance.now(); for (let i = 0; i < n; i++){ Clock.off += 1000 / 60; const t = now(); advance(t); draw(t); } return +((performance.now() - p0) / n).toFixed(3);
  },
};

// --- старт ---
(function boot(){
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ink = R3.rgb(css('--ink-edge'));
  COL.paint = CFG.paints.map(p => R3.rgb(p.col)); COL.paintDark = COL.paint.map(c => mix3(c, ink, 0.68)); COL.paintLit = COL.paint.map(c => mix3(c, [1, 1, 1], 0.06));
  const board = R3.rgb(css('--board'));
  const lumC = (c) => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
  const floor = mix3(board, [1, 1, 1], CFG.floorLift);
  COL.paintDim = COL.paint.map(c => mix3(floor, c, CFG.dimTint * (lumC(c) < 0.3 ? 0.6 : 1)));   // закрашенное до финала — «пол» с лёгким оттенком своего цвета
  COL.rawTop = COL.paint.map(c => mix3(R3.rgb(css('--blank')), c, CFG.rawTint)); COL.rawSideC = COL.paint.map(c => mix3(R3.rgb(css('--blank')), c, CFG.rawSide));
  COL.rawFarTop = COL.paint.map(c => mix3(mix3(R3.rgb(css('--blank')), c, CFG.rawFarTint), board, CFG.rawFar)); COL.rawFarSide = COL.rawSideC.map(c => mix3(c, board, CFG.rawFar + 0.15));
  COL.floorSeam = mix3(floor, [1, 1, 1], 0.16);   // светлый шов «плитки пола» по кромке закрашенной клетки (вид А)
  if (/[?&]v=flat(&|$)/i.test(location.search)) CFG.rise = false;
  if (/[?&]v=v02(&|$)/i.test(location.search)) CFG.well = false;
  { const gray = R3.rgb('#a3a8c4'), lumP = (c) => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11, light = R3.rgb('#c9cdf0');
    COL.pale = COL.paint.map(c => mix3(mix3(gray, c, CFG.paleTint), board, CFG.paleDark)); COL.paleSide = COL.pale.map(c => mix3(c, ink, 0.3));   // дальние — бледные
    COL.wellLip = COL.paint.map(c => lumP(c) < 0.3 ? mix3(c, light, 0.28) : c);                                                             // ободок: полный цвет (тёмный — чуть светлее)
    COL.wellIn = COL.paint.map(c => lumP(c) < 0.3 ? mix3(c, [0, 0, 0], 0.45) : mix3(c, ink, 0.6));                                             // чаша внутри — темнее
    COL.wellRim = COL.paint.map(c => lumP(c) < 0.3 ? light : null); }                                                                     // тёмной краске — светлая обводка ободка
  COL.stoneTop = R3.rgb('#9a9cb0'); COL.stoneSide = R3.rgb('#5d6078'); COL.stoneRim = R3.rgb('#c4c6d6');   // камень: холодный серый, светлая кромка
  COL.blankBase = R3.rgb(css('--blank')); COL.blank = COL.paint.map(c => mix3(COL.blankBase, c, CFG.blankTint)); COL.blankFar = COL.blank.map(c => mix3(c, board, CFG.farDark)); COL.farSide = COL.paint.map(c => mix3(c, board, CFG.farDark * 0.85));   // недостижимые пока клетки — чуть темнее (сильнее — путаются с приглушённым закрашенным)
  COL.blankRim = COL.blank.map(c => mix3(c, COL.white, CFG.reachRim)); COL.rawRim = COL.rawTop.map(c => mix3(c, COL.white, CFG.reachRim));   // постоянная кромка доступной клетки
  COL.cFar = COL.paint.map(c => mix3(mix3(COL.blankBase, c, CFG.cFarTint), board, CFG.cFarDark)); COL.cFarSide = COL.cFar.map(c => mix3(c, ink, 0.25));   // В: дальние — тихая пастель
  COL.cEdge = COL.paint.map(c => mix3(COL.blankBase, c, CFG.cEdgeTint)); COL.cEdgeRim = COL.cEdge.map(c => mix3(c, COL.white, 0.85));             // край пятна — яркий, светлая кромка
  COL.cStoneTop = R3.rgb('#6e7186'); COL.cStoneSide = R3.rgb('#41435a'); COL.cStoneRim = R3.rgb('#8d90a6');                                      // камень в «скульптуре» — тёмный матовый
  COL.paper = R3.rgb(css('--paper')); COL.secret = R3.rgb(css('--secret')); COL.secretDark = mix3(COL.secret, ink, 0.68);
  // тюбики: у тёмных красок контур светлый (иначе чёрный тюбик — дырка в тёмном фоне), крышка контрастная корпусу
  const lum = (c) => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11, edgeLight = R3.rgb('#c9cdf0');
  COL.tubeEdge = COL.paint.map((c, i) => lum(c) < 0.3 ? edgeLight : COL.paintDark[i]);
  COL.capCol = COL.paint.map(c => lum(c) > 0.78 ? R3.rgb('#3a3f6e') : R3.rgb('#f6f7fd'));
  COL.seal = R3.rgb('#ffc53d'); COL.sealDark = mix3(COL.seal, ink, 0.6);
  const rgba = (c, a) => 'rgba(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ',' + a + ')';
  PAL = { ink: css('--ink'), muted: css('--muted'), accent: css('--accent'), pill: css('--pill'), danger: css('--danger'), ok: css('--ok'), ghost: css('--ghost'), ghostDark: '#3a4076', band: '#fff3da',
          paint: CFG.paints.map(p => p.col), paintA: COL.paint.map(c => rgba(c, 0.75)), paint0: COL.paint.map(c => rgba(c, 0)),
          labelEdge: COL.paintDark.map(hexCss) };
  R3.init($('gl')); fit(); hud();
  try { if (document.fonts && document.fonts.load) document.fonts.load('900 16px Nunito'); } catch (e) {}
  openHash(location.hash.slice(1));
  requestAnimationFrame(frame);
  log('event', 'boot', 'levels=' + LEVELS.length);
})();
</script>
