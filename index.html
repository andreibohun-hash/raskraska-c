<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Раскраска · рост</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#232650">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<style>
/* Шрифт — свой файл (PROTO-BASE §1, §11): Nunito, OFL. */
@font-face{font-family:"Nunito";src:url("assets/fonts/nunito-latin.woff2") format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2212,U+00D7}
@font-face{font-family:"Nunito";src:url("assets/fonts/nunito-cyr.woff2") format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+2116}
/* Палитра — одно место; сцена и 2D-слой читают цвета через getComputedStyle (PROTO-BASE §9).
   Мир спокойный (приглушённый индиго): на нём одинаково читаются и белые, и чёрные пиксели картинок; сочные только краски и сами картинки.
   Светлой темы нет — сцена задумана тёмной. */
:root{
  --bg0:#2c3063; --bg1:#1c1f45; --frame:#232650; --ink:#ffffff; --muted:#b1b6e2; --card:#30366c;
  --accent:#ffc531; --amber:#ffb23e; --danger:#ff4d5e; --ok:#3ddc6f;
  --track:#343a70; --track-edge:#474e90; --chev:#8189da; --board:#4c5492; --board-edge:#363d78; --well:#434a86; --well-edge:#5d66a8;
  --slot:#1e2248; --slot-edge:#5058a6; --shadow:#0e1030; --paper:#e9ecfb; --blank:#eef0fb; --secret:#b9bfee;
  --veil:#0f1130; --bar:#3a4078; --bar-line:#ffc531; --pill:#171a3a; --ink-edge:#1b1640; --ghost:#5a629e;
  --frame-w:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#14162e;color:var(--ink);font:700 16px/1.3 "Nunito", system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100dvh;height:100svh;margin:0 auto;overflow:hidden;
  background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 100%)}
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
header{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
header .pill{background:var(--pill);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:900;letter-spacing:.2px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
header .sp{flex:1}
header button{pointer-events:auto;width:40px;height:40px;padding:0;border-radius:13px;background:var(--pill);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);display:grid;place-items:center}
header svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;font-weight:900;color:var(--ink);background:#4a5199;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
button.primary{background:linear-gradient(180deg,#ffd75a,#ffb21f);color:#4a2c00;box-shadow:0 4px 0 #b97a12}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(18,20,48,.9);padding:16px}
#overlay.show{display:flex}
.card{background:var(--card);border-radius:22px;padding:20px 18px;max-width:372px;width:100%;text-align:center;animation:pop .18s ease-out} /* с видимого состояния, не с opacity:0 (§9) */
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.card h2{margin:0 0 6px;font-weight:900;font-size:26px} .card p{color:var(--muted);margin:0 0 14px;font-weight:600;font-size:15px}
/* Галерея — она же выбор уровня: собранная картинка цветная, несобранная — силуэт с номером. */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 6px}
.levels button{position:relative;padding:0;aspect-ratio:1;border-radius:13px;background:var(--pill);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);overflow:hidden}
.levels button canvas{position:absolute;inset:0;width:100%;height:100%}
.levels button b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:17px;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.levels button.locked{opacity:.5} .levels button.done{box-shadow:inset 0 0 0 2px var(--accent)} .levels button.done b{display:none}
.cheat{margin-top:10px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);box-shadow:none;font-weight:700}
/* Карточка конца уровня — внизу: картинку на холсте не закрывает. */
#end{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--card);border-radius:22px;padding:16px 14px;text-align:center;animation:pop .18s ease-out;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.4)}
#end.hide{display:none}
#end h2{margin:0 0 2px;font-size:22px;font-weight:900} #end p{margin:0 0 10px;color:var(--muted);font-weight:600;font-size:14px}
#end .row{display:flex;gap:8px;justify-content:center}
#end .gal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 0 10px}
#end .gal span{position:relative;aspect-ratio:1;border-radius:8px;background:var(--pill);overflow:hidden}
#end .gal span.now{box-shadow:0 0 0 2px var(--accent)}
#end .gal span.pop{animation:stamp .35s ease-out}
#end .gal canvas{position:absolute;inset:0;width:100%;height:100%}
@keyframes stamp{from{transform:scale(1.7)}60%{transform:scale(.9)}to{transform:scale(1)}}
#end .reward{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px;font-size:28px;color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#end .reward img{width:40px;height:40px;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(4deg)}}
#flypic{position:absolute;left:0;top:0;width:120px;height:120px;pointer-events:none;transform-origin:0 0}
#flypic.hide{display:none}
#revive{position:absolute;transform:translate(-50%,-50%);padding:9px 14px;font-size:14px;box-shadow:0 0 0 4px rgba(255,178,62,.25);font-weight:900;border-radius:999px;background:var(--amber);color:#2a1c00;white-space:nowrap}
#revive.hide{display:none}
#revive small{font-weight:800;opacity:.7;margin-left:4px}
#toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(12,14,42,.92);padding:8px 14px;border-radius:12px;
  pointer-events:none;opacity:.98;transition:opacity .25s;font-size:14px;white-space:nowrap}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card,#end,#end .gal span.pop{animation:none} #toast{transition:none} }
</style>
</head>
<body>
<div id="frame">
  <div id="game"><canvas id="gl"></canvas><canvas id="fx"></canvas></div>
  <header>
    <span class="pill" id="hud-level">Картинка 1</span><span class="sp"></span>
    <button id="btn-reset" aria-label="заново"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg></button>
    <button id="btn-menu" aria-label="меню"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </header>
  <button id="revive" class="hide" data-act="revive">+1 место<small>AD</small></button>
  <div id="end" class="hide"></div>
  <canvas id="flypic" class="hide" width="240" height="240"></canvas>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="toast" class="hide"></div>
</div>
<script src="vendor/three.js"></script>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Раскраска», вариант В «рост из центра». Картинку раскрашивают клетка за клеткой, но красить начинают от готового зерна в центре:
//   краска с ленты летит по прямой внутрь, пролетает над пустыми клетками и прилипает к краю закрашенного — в последнюю пустую клетку
//   перед первой закрашенной клеткой (или камнем) на луче. Цвет совпал — клетка закрашена; нет — по этой стороне цели нет.
// Остальное — как в «Раскраске» на ядре Hexa Glide: одна клетка за заряд, одна плитка входа за круг, лента на 5 тюбиков, полка на 5
//   мест и проигрыш при переполнении, очередь колонками, «?», разгон ленты, когда очередь и полка пусты.
// Своё сверх правила: замурованная клетка (её уже не достанет ни один луч) затекает сама и списывает заряд своего цвета — см. sealCheck.
// Уровни строит tools/make-levels.mjs (эталонное прохождение — def.w); проверяют sim.mjs и test.mjs.
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила (порт констант HexaFlowSystem; это Hexa Glide, менять только с Андреем) ---
  maxCenter: 10,          // MaxCenter: капель в слое до заливки
  maxSlots: 5,            // MaxSlots: мест на полке; не хватило места — проигрыш
  maxOnConveyor: 5,       // MaxOnConveyor: капелек на ленте одновременно
  queueRows: 3,           // QueueRows: сколько рядов очереди видно
  stepInterval: 8 / 30,   // StepInterval, с: тик ленты (~8 с на круг из 30 клеток)
  queueEmptySpeedMul: 2,  // QueueEmptySpeedMul: ×2, когда очередь и полка пусты (лента разгоняется)
  jumpTime: 0.15,         // JumpTime, с: прыжок капельки на ленту. В игре 0,42; сокращён ради отклика («первая капля ≤ 150 мс после тапа»)
  chipSeg: 0.18,          // ChipMovingTime, с: один гекс пути капли краски (время полёта = клетки × chipSeg — как в игре)
  chipRollLead: 0.45,     // ChipRollLead: доля тика, которую капелька едет до вылета капли

  // --- краски: вид = номер в списке, он же цвет клетки в данных уровня. id — буква палитры картинок (tools/make-pics.py),
  //     col — чистый плоский цвет (без оттенков материала), note — MIDI-нота «буля» (все из пентатоники до) ---
  paints: [
    { id: 'W', name: 'белая',       col: '#ffffff', note: 76 },
    { id: 'K', name: 'чёрная',      col: '#2b2740', note: 60 },
    { id: 'R', name: 'красная',     col: '#ff4338', note: 64 },
    { id: 'O', name: 'оранжевая',   col: '#ff8d1f', note: 67 },
    { id: 'Y', name: 'жёлтая',      col: '#ffd426', note: 72 },
    { id: 'G', name: 'зелёная',     col: '#3fcf5c', note: 69 },
    { id: 'D', name: 'тёмно-зелёная', col: '#1f9d55', note: 62 },
    { id: 'C', name: 'голубая',     col: '#4fd2ff', note: 74 },
    { id: 'B', name: 'синяя',       col: '#2f7df6', note: 67 },
    { id: 'P', name: 'фиолетовая',  col: '#a25cf5', note: 62 },
    { id: 'M', name: 'розовая',     col: '#ff77b7', note: 74 },
    { id: 'N', name: 'коричневая',  col: '#a8642f', note: 60 },
    { id: 'T', name: 'песочная',    col: '#f4c98a', note: 69 },
    { id: 'S', name: 'серая',       col: '#9aa6c4', note: 64 },
    { id: 'L', name: 'салатовая',   col: '#a6e34f', note: 72 },
    { id: 'U', name: 'ночная',      col: '#27306b', note: 60 },
  ],

  // --- мир. Кольцо ленты всегда на одном месте (апофема 7,5), поэтому клетка тем мельче, чем больше поле: радиус клетки h = 5 / радиус кольца.
  //     Размеры плитки ниже — в долях клетки.
  camPitchDeg: 50,        // наклон ортокамеры — как LevelCameras в игре
  camPad: 1.03,           // запас кадрирования
  tileR: 0.93,            // радиус плитки (между соседними незакрашенными остаётся зазор)
  tileH: 0.8,             // высота незакрашенной клетки: стоячий блок — видно, что закрывает путь (краска в него упирается)
  reachLift: 0.18,        // клетка, до которой краска уже долетает, стоит чуть выше остальных (и со светлой кромкой)
  reachRim: 0.8,          // яркость светлой кромки у таких клеток
  peekRim: 1.0,           // зажата капелька: кромка клеток, куда она попадёт, пульсирует до этой яркости
  tileBevel: 0.08,        // фаска
  tileRound: 0.17,        // скругление углов
  pixelH: 0.05,           // высота готового пикселя: утоплен в холст, как пол, — краска пролетает над ним
  pixelGrow: 1.05,        // готовый пиксель чуть шире заготовки: швы картинки почти смыкаются
  fillR0: 0.15,          // откуда начинает растекаться краска по клетке (доля радиуса плитки); метки цвета в центре клетки нет с v0.4.1
  blankTint: 0.88,       // сколько цвета в верхе незакрашенной клетки (остальное — светлое): цвет читается самим блоком, без метки
  dropR: 0.5,             // радиус летящей капли краски (в клетках; не меньше dropMin)
  dropMin: 0.17,
  // раскладка — как в Hexa Glide: поле во всю ширину, лента вплотную к нему, под ней полка и очередь
  boardAp: 7.0,           // холст: апофема шестиугольника при клетке радиуса 1 (сцена подгоняет под сетку уровня)
  trackAp: 8.5,           // лента: внешняя апофема при клетке радиуса 1 (клетки ленты стоят на 7,5)
  wellR: 1.0,             // радиус клетки холста в клетках (соты смыкаются)
  slotZ: 12.5,            // полка: линия мест
  slotDX: 3.0,            //        шаг мест
  slotR: 1.3,             //        радиус места
  queueZ: 16.1,           // очередь: первый ряд
  queueDX: 3.3,           //          шаг колонок
  queueDZ: 2.55,          //          шаг рядов (все три ряда в кадре: тюбики лежат и в ряду не наползают друг на друга)
  carrierR: 1.0,          // радиус полной капельки на ленте
  carrierMin: 0.8,        // масштаб капельки с одной каплей
  carrierFull: 12,        // капель в «полной» капельке (масштаб 1)
  carrierOutline: 0.06,   // толщина контура тюбика (у тёмных красок он светлый)
  squeezeT: 0.2,          // с: тюбик сжимается и выдавливает колбаску краски
  squeezeKick: 0.14,      // на сколько тюбик откатывается назад при выстреле (доли длины)
  aimK: 420, aimD: 34,    // носик доворачивает к цели: жёсткость и затухание пружины поворота
  tubeRollMax: 0.36,      // насколько скручен хвост у тюбика с последним зарядом (доля длины корпуса); пустой докручивается до конца
  goneRollT: 0.26,        // с: пустой тюбик докручивается в рулончик
  goneFlyT: 0.42,         // с: рулончик улетает с искрой
  burstT: 0.16,           // с: проигрыш — тюбик на полке раздувается и лопается краской
  capPopT: 0.5,           // с: пломба «?» отщёлкивается и улетает
  ringScale: 1.3, ringMin: 0.52, ringMax: 0.8,                      // тюбик на ленте: в клетках, но не мельче и не крупнее этих пределов
  slotScale: 1.0, queueScale: 1.12,                                 // тюбик на полке / в очереди (в Hexa Glide очередь тоже крупнее поля)
  hudTopPx: 116,          // px: место сверху под цель (мини-картинка и счёт пикселей)
  barPx: 26,              // px: отступ снизу под очередью (панели бустеров нет с v0.4.1 — были заглушки)
  topBias: 0.45,          // какую долю лишней высоты экрана отдать низу (поле прижимается к верхней панели)
  goalPx: 66,             // px: карточка с мини-картинкой
  maxTiles: 420, maxDrops: 500, maxCarriers: 40,                    // потолки инстансов

  // --- фил (тюнить на телефоне) ---
  tapSquashT: 0.06,       // с: капелька сжимается перед прыжком
  tapSquash: 0.14,        // на сколько сжимается
  jumpArc: 1.5,           // высота дуги прыжка на ленту
  rideHop: 0.14,          // высота подскока капельки на каждом шаге ленты
  popT: 0.12,             // с: капля вылетает из макушки капельки к клетке входа
  shotSpeed: 0.55,        // доля времени фишки Hexa Glide на одну клетку пути (клетки мельче — путь в клетках длиннее)
  shotArc: 0.5,           // высота дуги полёта капли (плюс shotArcPer на каждую единицу пути)
  shotArcPer: 0.08,
  shotStretch: 2.4,       // во сколько раз колбаска краски вытянута по ходу
  splatT: 0.14,           // с: «шмяк» — колбаска расплющивается лепёшкой на клетке
  splashN: 2,             // брызг от каждой капли (2D-бусины)
  hitStopScale: 0.02,     // скорость игровых часов в хит-стопе (сейчас хит-стоп не вызывается: клеток слишком много, игра бы заикалась)
  dimT: 0.45,             // с: закрашенная клетка уходит из полного цвета в приглушённый (до конца картинки)
  look: 'C',              // вид поля варианта В: закрашенное — мокрая краска в полном цвете сразу (как вид Б v0.5), картинка распускается от зерна;
                          //   незакрашенное на рубеже — высокий блок своего цвета со светлой кромкой, дальнее — ниже и тише (как вид А)
  rawTint: 0.5,           // Б: сколько своего цвета в верхе доступной незакрашенной клетки — пастель «сырого холста» (чёрный — серый)
  rawSide: 0.62,          //    и в её боках
  rawFarTint: 0.3,        //    недоступная — бледнее (меньше своего цвета)…
  rawFar: 0.3,            //    …ниже и ближе к холсту (доля цвета холста)
  dimTint: 0.2,           // закрашенное до конца картинки — «пол»: цвет холста чуть светлее и только 20% своего цвета (v0.4.2: не мешает считывать, что красить дальше)
  floorLift: 0.07,        // насколько «пол» закрашенного светлее холста (иначе путается с пустыми сотами)
  farH: 0.55,             // незакрашенная клетка, до которой краска пока не долетает: ниже (доля высоты блока)…
  farDark: 0.4,           // …и тише: верх и бока смешаны с цветом холста (цвет виден — планирование не прятать)
  rise: true,             // В с v0.2: закрашенное поднимается высоким ярким блоком (картинка растёт скульптурой), незакрашенное — плоские
                          //   пастельные плитки; край пятна — плоский, но яркий, с кромкой и пульсом. URL ?v=flat — прежний вид v0.1 (для сравнения)
  riseH: 1.0,             // высота закрашенного блока (доля высоты блока tileH)
  flatH: 0.14,            // высота незакрашенной плитки; край пятна — чуть выше (flatReach)
  flatReach: 0.2,
  riseOver: 0.32,         // перелёт «подъёма»: блок вырастает с отскоком (растяжение по высоте, сжатие в ширину)
  edgePulse: 0.16,        // пульс свечения у клеток края пятна
  cFarTint: 0.42,         // дальние незакрашенные: пастель (сколько своего цвета поверх светлой основы)…
  cFarDark: 0.3,          // …и тише (смесь с холстом)

// ===== Ядро варианта В «рост из центра». Основа — ядро Hexa Glide из веб-порта (лента, очередь, полка, «?», разгон, одна плитка
// входа за круг) — перенесена и переписана в одном месте: выбор цели. Сверки с веб-портом больше нет: правило своё.
// >>> РОСТ
const DIRS = [[0,1],[-1,1],[-1,0],[0,-1],[1,-1],[1,0]];
// Соседи HexCoord (_neighbors) — другой порядок, используется только для обхода кольца
const NEIGHBORS = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const K = (q, r) => q + ',' + r;
const UNK = s => { const i = s.indexOf(','); return [+s.slice(0, i), +s.slice(i + 1)]; };
function hexDist(aq, ar, bq, br){
  const dq = aq - bq, dr = ar - br;
  return (Math.abs(dq) + Math.abs(dq + dr) + Math.abs(dr)) / 2;
}
// HexCoord.SingleRing: старт в center + neighbors[4]*radius, затем по 6 сторон
function singleRing(radius){
  const out = [];
  let q = NEIGHBORS[4][0] * radius, r = NEIGHBORS[4][1] * radius;
  for (let i = 0; i < 6; i++){
    for (let j = 0; j < radius; j++){
      out.push(K(q, r));
      q += NEIGHBORS[i][0]; r += NEIGHBORS[i][1];
    }
  }
  return out;
}
// HexaFlowTestLevel.InwardDir: направление грида, ведущее ближе всего к центру
function inwardDir(k){
  const [q, r] = UNK(k);
  let best = 0, bestLen = 1e9;
  for (let d = 0; d < 6; d++){
    const len = hexDist(q + DIRS[d][0], r + DIRS[d][1], 0, 0);
    if (len < bestLen){ bestLen = len; best = d; }
  }
  return best;
}
// Залитый гексагон радиуса R — пол поля
function filledHex(radius){
  const out = [];
  for (let q = -radius; q <= radius; q++){
    const lo = Math.max(-radius, -q - radius), hi = Math.min(radius, -q + radius);
    for (let r = lo; r <= hi; r++) out.push(K(q, r));
  }
  return out;
}
// Геометрия поля радиуса R (одна на радиус): номера клеток, соседи по 6 сторонам и «линия наружу» — клетки X−d, X−2d… до края поля.
// Клетку X краска достаёт по стороне d, когда сосед X+d закрашен (или камень), а линия наружу от X в сторону −d пуста: по ней краска
// и прилетает с ленты (каждая прямая гекса, выходя из поля, проходит через клетку ленты).
const GEO = new Map();
function geometry(fieldR){
  if (GEO.has(fieldR)) return GEO.get(fieldR);
  const keys = filledHex(fieldR), idx = new Map(keys.map((k, i) => [k, i])), N = keys.length;
  const nb = new Int32Array(N * 6).fill(-1), out = new Array(N * 6);
  keys.forEach((k, i) => {
    const [q, r] = UNK(k);
    for (let d = 0; d < 6; d++){
      const n = idx.get(K(q + DIRS[d][0], r + DIRS[d][1])); if (n !== undefined) nb[i * 6 + d] = n;
      const line = []; let x = q - DIRS[d][0], y = r - DIRS[d][1];
      while (idx.has(K(x, y))){ line.push(idx.get(K(x, y))); x -= DIRS[d][0]; y -= DIRS[d][1]; }
      out[i * 6 + d] = Int32Array.from(line);
    }
  });
  const g = { keys, idx, nb, out, N };

}

function loadLevel(def){
  const fieldR = def.fr || 4, ringR = def.rr || 5;

    name: def.n, diff: def.d || 0, fieldR, ringR,
    field: new Set(filledHex(fieldR)),
    ring: singleRing(ringR),
    inward: null,
    center: new Map(),        // незакрашенные клетки картинки: k → { layers: [{color, amount}] } (один слой, до полного — одна капля)
    painted: new Map(),       // закрашенные клетки: k → цвет (зерно уровня и всё, что закрасили)
    stones: new Set(),        // камни: не красятся, краска к ним липнет, как к закрашенному
    sealed: 0,                // клеток затекло само: замурованы — ни один луч их уже не достанет (см. sealCheck)
    columns: [],              // [колонка][ряд] = {color, count, link, secret}
    travelers: [],            // тюбики на ленте
    slots: [],                // полка, ≤ maxSlots
    pending: new Set(),       // клетки, на которые краска уже отправлена, но ещё летит — закрывают луч
    capacity: CFG.maxOnConveyor,
    deposited: 0, needed: 0,  // прогресс: уложено капель / нужно всего
    ended: null,              // null | 'win' | 'lose'
    travSeq: 0,
    geo: geometry(fieldR),
  };
  st.inward = st.ring.map(inwardDir);
  st.sol = new Uint8Array(st.geo.N);      // по номеру клетки: закрашено или камень
  st.un = new Uint8Array(st.geo.N);       //                  незакрашенная клетка картинки
  for (const row of def.c || []){
    const q = row[0], r = row[1], layers = [];
    for (let i = 2; i + 1 < row.length; i += 2) layers.push({ color: row[i], amount: row[i + 1] });
    if (!layers.length) continue;
    st.center.set(K(q, r), { layers }); st.un[st.geo.idx.get(K(q, r))] = 1;
    for (const l of layers) st.needed += Math.max(0, CFG.maxCenter - l.amount);
  }
  for (const s of def.s || []){ const k = K(s[0], s[1]); st.painted.set(k, s[2]); st.sol[st.geo.idx.get(k)] = 1; }
  for (const s of def.x || []){ const k = K(s[0], s[1]); st.stones.add(k); st.sol[st.geo.idx.get(k)] = 1; }
  for (const col of def.q || []){
    st.columns.push(col.map(s => ({ color: s[0], count: s[1], link: s[2] || 0, secret: !!s[3] })));
  }

const isSolid = (st, k) => st.painted.has(k) || st.stones.has(k);
// Секретная стопка снимает флаг, попав в первый ряд очереди
function revealFronts(st){
  const out = [];
  for (let c = 0; c < st.columns.length; c++){
    const f = st.columns[c][0];
    if (f && f.secret){ f.secret = false; out.push(c); }
  }
  return out;
}
function queueEmpty(st){ return st.columns.every(c => c.length === 0); }
// IsEndgameLoop: очередь И полка пусты → тюбики не паркуются, а идут новыми кругами (и лента ×2)
function endgameLoop(st){ return queueEmpty(st) && st.slots.length === 0; }
function stepInterval(st){ return endgameLoop(st) ? CFG.stepInterval / CFG.queueEmptySpeedMul : CFG.stepInterval; }
function isWon(st){ return st.center.size === 0; }

// ВЫБОР ЦЕЛИ (своё правило варианта В). Краска летит по прямой внутрь по всем 6 сторонам от клетки ленты, пролетает над пустыми
// клетками и прилипает к краю закрашенного: в последнюю пустую клетку перед первой закрашенной клеткой (или камнем) на луче.
// Цвет этой клетки совпал с краской — она цель; нет (или это не клетка картинки) — по этой стороне цели нет. Берётся ближайшая цель.
function scanTarget(st, ringK, color, usedEntries){
  const [rq, rr] = UNK(ringK);
  let best = null, bestDist = 1e9;

    let q = rq, r = rr, last = null, lastS = 0;

      if (isSolid(st, k)){

        if (pile){

        }

// +1 капля в клетку; клетка закрашена — становится краем, к которому липнет следующая краска
function applyDeposit(st, trav, targetK){
  const pile = st.center.get(targetK);
  const top = pile.layers[pile.layers.length - 1];
  top.amount += 1;
  trav.remaining -= 1;
  st.deposited += 1;
  const layerCleared = top.amount >= CFG.maxCenter;
  let cellCleared = false;
  if (layerCleared){
    if (pile.layers.length > 1) pile.layers.pop();
    else {
      st.center.delete(targetK); cellCleared = true;
      st.painted.set(targetK, top.color); const i = st.geo.idx.get(targetK); st.sol[i] = 1; st.un[i] = 0;

}
// Линия наружу от клетки i в сторону −d пуста (нет закрашенного и камней)
function lineClear(st, i, d){ const L = st.geo.out[i * 6 + d]; for (let j = 0; j < L.length; j++) if (st.sol[L[j]]) return false; return true; }

function canHit(st, i){
  const nb = st.geo.nb;
  for (let d = 0; d < 6; d++){ const n = nb[i * 6 + d]; if (n >= 0 && st.sol[n] && lineClear(st, i, d)) return true; }

// ЗАМУРОВАННЫЕ КЛЕТКИ. Закрашенное только растёт, линии только закрываются — клетка, которую никакой порядок закрашивания уже не

// точка: достижимые сейчас + клетки, у которых сосед по стороне d достижим когда-нибудь, а линия наружу пуста. Остальное — замуровано.
const OPP = [3, 4, 5, 0, 1, 2];
function sealCheck(st, ev){
  const g = st.geo, N = g.N;
  for (;;){
    const can = new Uint8Array(N), stack = [];
    for (let i = 0; i < N; i++) if (st.un[i] && canHit(st, i)){ can[i] = 1; stack.push(i); }

      const from = takeCharge(st, color);

// Заряд за затёкшую клетку: с тюбика её цвета на ленте (у кого больше), иначе с полки, иначе с самого дальнего в очереди
// (наибольший ряд, при равенстве — правая колонка). Запас каждой краски всегда равен её незакрашенным клеткам.
// Возвращает, откуда взят: { trav } | { trav, slot, gone } | { col, row, item } | null.
function takeCharge(st, color){
  let best = null;
  for (const t of st.travelers) if (t.color === color && t.remaining > 0 && (!best || t.remaining > best.remaining)) best = t;
  if (best){ best.remaining--; return { trav: best }; }
  for (let i = 0; i < st.slots.length; i++){
    const t = st.slots[i]; if (t.color !== color || t.remaining <= 0) continue;
    t.remaining--; const gone = t.remaining <= 0; if (gone) st.slots.splice(i, 1);
    return { trav: t, slot: i, gone };
  }
  let col = -1, row = -1;

  if (!hit) return false;

function occupiedCells(st, except){
  const s = new Set();
  for (const t of st.travelers) if (t !== except) s.add(t.ringIndex);

// FirstFreeEntryCell: на старт (0) встаём, только если свободны и он, и клетка перед ним —
// иначе новая стопка окажется позади уже стоящих (переворот порядка)
function firstFreeEntryCell(st, except){

    if (occ.has(c)){ spawn = ((c - 1) % n + n) % n; seen = true; }
    else if (seen) break;
  }
  return spawn;
}
function makeTraveler(st, color, count, link, t){
  const cell = firstFreeEntryCell(st);
  const trav = { id: st.travSeq++, color, remaining: Math.max(1, count), ringIndex: cell,
                 cellsTraveled: 0, started: cell === 0, link: link || 0,
                 usedEntries: new Set(), lastAim: -1,
                 entering: true, enterAt: t, enterUntil: t + CFG.jumpTime, visFrom: cell, visAt: t };
  st.travelers.push(trav);
  return trav;
}

// Тап по колонке очереди. Возвращает список событий либо null (деплой невозможен).
function deployColumn(st, col, t){
  if (st.ended) return null;
  const cols = st.columns;
  if (!cols[col] || !cols[col].length) return null;
  const front = cols[col][0];
  const ev = [];
  if (front.link > 0){
    // Связка деплоится только целиком: все члены должны стоять на фронте своих колонок
    const fronts = [];
    let buried = false;
    for (let c = 0; c < cols.length; c++){
      for (let r = 0; r < cols[c].length; r++){
        if (cols[c][r].link !== front.link) continue;
        if (r === 0) fronts.push(c); else buried = true;
      }
    }
    if (buried) return { rejected: 'buried', link: front.link, ev: [] };
    if (st.travelers.length + fronts.length > st.capacity) return { rejected: 'full', link: front.link, ev: [] };
    fronts.sort((a, b) => a - b);
    if (col !== fronts[0]) fronts.reverse();
    for (const c of fronts){
      const s = cols[c].shift();
      const trav = makeTraveler(st, s.color, s.count, s.link, t);
      ev.push({ kind: 'deploy', trav, col: c, row: 0, linked: true });
    }
  } else {
    if (st.travelers.length >= st.capacity) return { rejected: 'full', ev: [] };
    const s = cols[col].shift();
    const trav = makeTraveler(st, s.color, s.count, 0, t);
    ev.push({ kind: 'deploy', trav, col, row: 0 });
  }
  for (const c of revealFronts(st)) ev.push({ kind: 'reveal', col: c });
  return { ev };
}
// Тап по слоту парковки: стопка возвращается на ленту (связка — только целиком)
function relaunchSlot(st, idx, t){
  if (st.ended) return null;
  const trav = st.slots[idx];
  if (!trav) return null;
  const group = trav.link > 0 ? st.slots.filter(s => s.link === trav.link) : [trav];
  if (st.travelers.length + group.length > st.capacity) return { rejected: 'full', ev: [] };
  const ev = [];
  for (const g of group){
    const from = st.slots.indexOf(g);
    st.slots.splice(from, 1);
    g.cellsTraveled = 0; g.lastAim = -1; g.usedEntries.clear();
    g.ringIndex = firstFreeEntryCell(st, g);
    g.started = g.ringIndex === 0;
    g.entering = true; g.enterAt = t; g.enterUntil = t + CFG.jumpTime;
    g.visFrom = g.ringIndex; g.visAt = t;
    st.travelers.push(g);
    ev.push({ kind: 'relaunch', trav: g, slot: from });
  }
  return { ev };
}
// Приземление после прыжка: клетка входа тоже отдаёт фишку (TryDepositOnLanding).
// StartMovingNow (немедленный шаг вне фазы тика) не портируем — это сглаживание визуала;
// на данные он влияет только тем, что стопка трогается на тик раньше.
function landTravelers(st, t){
  const ev = [];
  for (const trav of st.travelers){
    if (!trav.entering || t < trav.enterUntil) continue;
    trav.entering = false;
    if (trav.started && trav.remaining > 0 && trav.ringIndex !== trav.lastAim){
      if (deposit(st, trav, st.ring[trav.ringIndex], ev)) trav.lastAim = trav.ringIndex;
    }
  }
  return ev;
}
function groupHasChips(st, link){
  return st.travelers.some(t => t.link === link && t.remaining > 0) ||
         st.slots.some(t => t.link === link && t.remaining > 0);
}

// StepSlide: один тик ленты. Порядок внутри тика — от хвоста списка к голове, как в игре.
function step(st, t){
  const ev = [];
  if (st.ended || !st.travelers.length) return ev;
  const ring = st.ring, n = ring.length;
  const occ = occupiedCells(st);
  for (let i = st.travelers.length - 1; i >= 0; i--){
    const trav = st.travelers[i];
    if (trav.entering) continue;       // прыжок ещё летит: клетку резервирует, но не едет и не кладёт

    // 1) Укладка с упреждением на клетку: цель ищем от клетки, в которую стопка встанет этим же тиком
    let aim = trav.ringIndex;
    const next = (trav.ringIndex + 1) % n;
    const willMove = next !== trav.ringIndex && !occ.has(next);
    const staysOnRing = trav.cellsTraveled + 1 < n || endgameLoop(st);
    if (willMove && staysOnRing && trav.remaining > 1) aim = next;
    if ((trav.started || aim === 0) && aim !== trav.lastAim){
      if (deposit(st, trav, ring[aim], ev)) trav.lastAim = aim;
    }

    // 2) Груз сдан: одиночная стопка уходит с ленты сразу, связанная едет пустым поддоном с партнёрами
    if (trav.remaining <= 0){
      if (trav.link > 0){
        if (!groupHasChips(st, trav.link)){
          const gone = st.travelers.filter(x => x.link === trav.link);
          st.travelers = st.travelers.filter(x => x.link !== trav.link);
          for (const g of gone) ev.push({ kind: 'despawn', trav: g });
          return ev;                   // список изменился — дотикаем в следующий Step
        }
      } else {
        occ.delete(trav.ringIndex);
        st.travelers.splice(i, 1);
        ev.push({ kind: 'despawn', trav });
        continue;
      }
    }

    // 3) Продвижение на следующую клетку (no-overtaking)
    if (next !== trav.ringIndex && !occ.has(next)){
      occ.delete(trav.ringIndex);
      trav.visFrom = trav.ringIndex; trav.visAt = t;
      trav.ringIndex = next;
      if (next === 0){ trav.started = true; trav.usedEntries.clear(); }   // новый круг — плитки входа свободны
      occ.add(next);
      trav.cellsTraveled++;
      ev.push({ kind: 'move', trav });
    }

    // 4) Полный круг пройден, а фишки остались
    if (trav.cellsTraveled >= n){
      if (endgameLoop(st)){
        trav.cellsTraveled = 0; trav.lastAim = -1; trav.usedEntries.clear();
      } else if (trav.link > 0){
        const group = st.travelers.filter(x => x.link === trav.link);
        if (st.slots.length + group.length <= CFG.maxSlots){
          st.travelers = st.travelers.filter(x => x.link !== trav.link);
          for (const g of group){ g.cellsTraveled = 0; st.slots.push(g); ev.push({ kind: 'park', trav: g, slot: st.slots.length - 1 }); }
        } else {
          st.ended = 'lose'; ev.push({ kind: 'lose', trav });
        }
        return ev;                     // список изменился — дотикаем в следующий Step
      } else {
        occ.delete(trav.ringIndex);
        st.travelers.splice(i, 1);
        if (st.slots.length < CFG.maxSlots){
          trav.cellsTraveled = 0;
          st.slots.push(trav);
          ev.push({ kind: 'park', trav, slot: st.slots.length - 1 });
        } else {
          st.ended = 'lose';
          ev.push({ kind: 'lose', trav });
          return ev;
        }
      }
    }
  }
  if (!st.ended && isWon(st)) { st.ended = 'win'; ev.push({ kind: 'win' }); }
  return ev;
}
// Победа может наступить и вне тика — сразу после последней укладки
function checkWin(st, ev){
  if (!st.ended && isWon(st)){ st.ended = 'win'; ev.push({ kind: 'win' }); }
  return ev;
}
// Допустимые действия — для ботов и симулятора
function legalActions(st){
  const out = [];
  if (st.ended) return out;
  for (let c = 0; c < st.columns.length; c++){
    const f = st.columns[c][0];
    if (!f) continue;
    if (f.link > 0){
      let fronts = 0, buried = false;
      for (let i = 0; i < st.columns.length; i++)
        for (let r = 0; r < st.columns[i].length; r++)
          if (st.columns[i][r].link === f.link){ if (r === 0) fronts++; else buried = true; }
      if (buried || st.travelers.length + fronts > st.capacity) continue;
    } else if (st.travelers.length >= st.capacity) continue;
    out.push({ kind: 'column', i: c });
  }
  const seen = new Set();
  for (let i = 0; i < st.slots.length; i++){
    const s = st.slots[i];
    if (s.link > 0){ if (seen.has(s.link)) continue; seen.add(s.link); }
    const need = s.link > 0 ? st.slots.filter(x => x.link === s.link).length : 1;
    if (st.travelers.length + need <= st.capacity) out.push({ kind: 'slot', i });
  }
  return out;
}
function applyAction(st, a, t){
  return a.kind === 'column' ? deployColumn(st, a.i, t) : relaunchSlot(st, a.i, t);
}

// --- бот (общий для игры и симулятора; не правила, но источник один) ---
// Порт эталонного игрока из HexaFlowSystem.IsQueuePlayable — им игра проверяет, что уровень
// вообще проходится. Приоритеты те же:
//   1. вернуть с парковки стопку, чей цвет достижим прямо сейчас;
//   2. иначе выпустить фронт очереди, который сейчас полезен и даёт минимальный «мёртвый» излишек;
//   3. иначе выпустить любой фронт, чтобы добраться до стопки за ним (пока парковка держит);
//   4. иначе ходов нет — это и есть затор.

// Достижимые клетки: те, что сейчас стоят на краю закрашенного под открытым лучом (правило scanTarget без цвета)
function reachableSet(st){
  const out = new Set(), g = st.geo;
  for (let i = 0; i < g.N; i++) if (st.un[i] && canHit(st, i)) out.add(g.keys[i]);
  return out;
}
// Достижимая нужда по цветам — для подсветки и оценки хода
function reachableNeed(st){
  const need = new Map();
  for (const k of reachableSet(st)){
    const top = st.center.get(k).layers.slice(-1)[0];
    need.set(top.color, (need.get(top.color) || 0) + (CFG.maxCenter - top.amount));
  }
  return need;
}
// RemainingNeed: сколько фишек цвета нужно полю ВСЕГО, включая закрытые слои
function totalNeed(st, color){
  let need = 0;
  for (const pile of st.center.values())
    for (const l of pile.layers) if (l.color === color) need += Math.max(0, CFG.maxCenter - l.amount);
  return need;
}
function greedyAction(st, rng){
  const acts = legalActions(st);
  if (!acts.length) return null;
  // Сколько фишек каждого цвета поле готово принять ПРЯМО СЕЙЧАС, за вычетом уже едущего по ленте.
  // Эталонный солвер игры развозит по одной стопке за раз и такого учёта не требует; здесь стопки
  // едут одновременно, и без него бот заваливает ленту одним цветом сверх спроса — это и есть затор.
  const free = reachableNeed(st);
  for (const t of st.travelers) free.set(t.color, (free.get(t.color) || 0) - t.remaining);
  const fits = group => st.slots.length + group.length <= CFG.maxSlots;
  const groupOf = s => s.link > 0 ? st.columns.filter(c => c[0] && c[0].link === s.link).map(c => c[0]) : [s];

  // 1) вернуть с парковки стопку, чей цвет поле сейчас примет
  const slotActs = acts.filter(a => a.kind === 'slot' && st.slots[a.i].remaining > 0 &&
                                    (free.get(st.slots[a.i].color) || 0) > 0);
  if (slotActs.length) return slotActs[Math.floor(rng() * slotActs.length) % slotActs.length];

  // 2) фронт очереди, который сейчас полезен, с минимальным «мёртвым» излишком (RemainingNeed).
  //    У связки полезными должны быть ВСЕ члены: группа занимает слот на каждого, и один
  //    ненужный цвет утаскивает на парковку всю сцепку.
  let best = null, bestWaste = Infinity;
  for (const a of acts){
    if (a.kind !== 'column') continue;
    const group = groupOf(st.columns[a.i][0]);
    if (!group.every(g => (free.get(g.color) || 0) > 0)) continue;
    if (!fits(group)) continue;
    let waste = 0;
    for (const g of group) waste += Math.max(0, g.count - totalNeed(st, g.color));
    if (waste < bestWaste){ bestWaste = waste; best = a; }
  }
  if (best) return best;

  // 3) на ленте ещё идёт доставка — обычно ждём, а не забиваем ленту лишним. Ожидание не вечное:
  //    иногда ходим всё равно, иначе бот залипает на стопке, которая свою цель уже не найдёт.
  if (st.travelers.some(t => t.remaining > 0) && st.slots.length < CFG.maxSlots && rng() > 0.12) return null;

  // 4) копаем очередь: выпускаем застрявший фронт, чтобы добраться до стопки за ним
  for (const a of acts){
    if (a.kind !== 'column') continue;
    const group = groupOf(st.columns[a.i][0]);
    if (fits(group)) return a;
  }
  return null;
}
// <<< РОСТ
// ===== конец ядра варианта В =====

// Вид краски для каждого цвета уровня: по порядку появления (сначала плитки, потом очередь), с перестановкой def.m.
function paintMap(def){
  const m = new Map();
  const add = (c) => { if (!m.has(c)) m.set(c, def.m && def.m[m.size] !== undefined ? def.m[m.size] : m.size); };
  for (const row of def.c) for (let i = 2; i + 1 < row.length; i += 2) add(row[i]);
  for (const row of def.s || []) add(row[2]);
  for (const col of def.q) for (const s of col) add(s[0]);
  return m;
}

// --- безголовый прогон и солвер (из analysis.mjs веб-порта; исполняются и симулятором, и хуком) ---
// >>> PLAYOUT
// Капли долетают мгновенно — снимаем блокировку клетки сразу после укладки.
function settle(st, ev){ for (const e of ev) if (e.kind === 'deposit' && (e.layerCleared || e.cellCleared)) st.pending.delete(e.target); }
function randomAct(st, rng){ const acts = legalActions(st); return acts.length ? acts[Math.floor(rng() * acts.length)] : null; }
const MAX_TICKS = 4000;
// Реалтайм-партия: одно решение политики за тик, тики по stepInterval, прыжок мгновенный.
function playout(def, policy, seed){
  const jt = CFG.jumpTime; CFG.jumpTime = 0;
  try {
    const st = loadLevel(def), rng = mulberry32(seed);
    let t = 0, ticks = 0, actions = 0, idle = 0, peak = 0;
    while (!st.ended && ticks < MAX_TICKS){
      let acted = false; const empty = !st.travelers.length;
      if (st.travelers.length < st.capacity){
        const act = policy(st, rng, ticks);
        if (act){ const res = applyAction(st, act, t); if (res && !res.rejected){ settle(st, res.ev); actions++; acted = true; } }
      }
      idle = acted || !empty ? 0 : idle + 1;     // тупик — лента пуста, а ходить нечем несколько тиков подряд
      settle(st, landTravelers(st, t));
      settle(st, step(st, t));
      peak = Math.max(peak, st.slots.length);
      t += stepInterval(st); ticks++;
      if (!st.ended && !st.travelers.length && idle > 2) return { won: false, stuck: true, ticks, actions, left: st.center.size, peak, sealed: st.sealed };
    }
    return { won: st.ended === 'win', jam: st.ended === 'lose', timeout: ticks >= MAX_TICKS, ticks, actions, left: st.center.size, peak, secs: t, sealed: st.sealed };
  } finally { CFG.jumpTime = jt; }
}
// Порт HexaFlowSystem.IsQueuePlayable — солвер, которым сама игра проверяет проходимость уровня (без изменений).
function queuePlayable(def, maxSlots){
  maxSlots = maxSlots || CFG.maxSlots;
  const st = loadLevel(def);
  const colQ = st.columns.map(c => c.slice());
  const parked = [];
  let parkedPeak = 0, guard = 0;
  const slotsOf = u => u.colors.length;
  const parkedSlots = () => parked.reduce((n, u) => n + slotsOf(u), 0);
  const topOf = k => st.center.get(k).layers[st.center.get(k).layers.length - 1];
  const countColor = (rs, color) => { let n = 0; for (const k of rs) if (topOf(k).color === color) n++; return n; };
  const unitUseful = (u, rs) => u.colors.some((c, i) => u.counts[i] > 0 && countColor(rs, c) > 0);
  const unitFromFronts = col => {
    if (!colQ[col].length) return null;
    const front = colQ[col][0];
    if (!front.link) return { unit: { colors: [front.color], counts: [front.count], link: 0 }, cols: [col] };
    const colors = [], counts = [], cols = [];
    for (let c = 0; c < colQ.length; c++){
      if (!colQ[c].length || colQ[c][0].link !== front.link) continue;
      colors.push(colQ[c][0].color); counts.push(colQ[c][0].count); cols.push(c);
    }
    let total = 0;
    for (const c of colQ) for (const e of c) if (e.link === front.link) total++;
    if (colors.length !== total) return null;
    return { unit: { colors, counts, link: front.link }, cols };
  };
  while (st.center.size > 0){
    if (++guard > 100000) return { ok: false, reason: 'guard overflow', parkedPeak };
    const rs = reachableSet(st);
    let unit = null;
    for (let i = 0; i < parked.length; i++) if (unitUseful(parked[i], rs)){ unit = parked.splice(i, 1)[0]; break; }
    if (!unit){
      let bestWaste = Infinity, bestCols = null;
      for (let c = 0; c < colQ.length; c++){
        const cand = unitFromFronts(c);
        if (!cand || !unitUseful(cand.unit, rs)) continue;
        if (parkedSlots() + slotsOf(cand.unit) > maxSlots) continue;
        let waste = 0;
        cand.unit.colors.forEach((col, i) => { waste += Math.max(0, cand.unit.counts[i] - totalNeed(st, col)); });
        if (waste < bestWaste){ bestWaste = waste; unit = cand.unit; bestCols = cand.cols; }
      }
      if (unit) for (const c of bestCols) colQ[c].shift();
    }
    if (!unit){
      let dug = false;
      for (let c = 0; c < colQ.length && !dug; c++){
        const cand = unitFromFronts(c);
        if (!cand || parkedSlots() + slotsOf(cand.unit) > maxSlots) continue;
        for (const cc of cand.cols) colQ[cc].shift();
        parked.push(cand.unit);
        parkedPeak = Math.max(parkedPeak, parkedSlots());
        dug = true;
      }
      if (dug) continue;
      const anyLeft = colQ.some(c => c.length);
      return { ok: false, parkedPeak, reason: !anyLeft ? 'очередь пуста, холст не закрашен (осталось ' + st.center.size + ')'
                                                     : 'затор: мест ' + parkedSlots() + '/' + maxSlots + ', осталось ' + st.center.size };
    }
    for (let m = 0; m < unit.colors.length; m++){
      const color = unit.colors[m];
      const fake = { remaining: unit.counts[m] };
      while (fake.remaining > 0){                // по одной клетке: закрашенное здесь не только открывает, но и закрывает лучи
        let hit = null;
        for (const cc of reachableSet(st)){ const top = st.center.get(cc).layers.slice(-1)[0]; if (top.color === color && top.amount < CFG.maxCenter){ hit = cc; break; } }
        if (!hit) break;
        if (applyDeposit(st, fake, hit).cellCleared) sealCheck(st, null);
      }
      unit.counts[m] = fake.remaining;
    }
    if (unit.counts.some(c => c > 0)){ parked.push(unit); parkedPeak = Math.max(parkedPeak, parkedSlots()); }
  }
  return { ok: true, parkedPeak };
}
// Эталонный игрок: повторяет прохождение, записанное генератором уровней (def.w — [тик, 0 колонка | 1 полка, номер]).
// В безголовом прогоне ядро детерминировано, поэтому повтор обязан выиграть — это проверка, что очередь собрана под правило.
function refPolicy(def){
  const at = new Map((def.w || []).map(a => [a[0], a]));
  return (st, rng, tick) => { const a = at.get(tick); return a ? { kind: a[1] ? 'slot' : 'column', i: a[2] } : null; };
}
// <<< PLAYOUT
// Бот-транжира: выпускает любую капельку, не глядя на холст, — так игра проигрывается (проверка затора).
function dumbAction(st, rng){ const acts = legalActions(st).filter(a => a.kind === 'column'); return acts.length ? acts[Math.floor(rng() * acts.length)] : null; }
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* КОНЕЦ ЯДРА */
</script>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Оболочка: экраны, ввод, ощущение, сейв, дебаг-хук. Правил здесь нет — только то, как их показать и озвучить.
// Время абсолютное (§4): игровые часы now() — функция от performance.now(); хит-стоп, замедление и пауза — масштаб часов.
// ---------------------------------------------------------------------------
const NAME = 'raskraska-c';
const SAVE_KEY = NAME + '.v1';
const $ = (id) => document.getElementById(id);
function loadSave(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) {} }

const G = {
  st: null, li: 0, def: null,        // состояние ядра, номер и описание уровня
  screen: 'menu',                    // menu | game | win | lose | help
  save: Object.assign({ level: 0, muted: false, best: {}, unlockAll: false, coins: 0 }, loadSave()),
  speed: 1, slow: 1, paused: false,  // множители игровых часов: отладка, замедление проигрыша, пауза
  kinds: new Map(),                  // цвет ядра → вид краски
  vp: new Map(),                     // клетки картинки на экране: k → { x, z, kind, state: 'tile' | 'fill' | 'pixel', … }
  shots: [], fills: [],              // летящие капли краски, клетки, по которым сейчас разливается краска
  spray: [],                         // 3D-брызги: корона заливки, салют, дождь, проигрыш (баллистика в замкнутом виде)
  wv: new Map(), gone: [],           // капельки на экране (объект ядра → вид) и лопающиеся пустые
  fx: [],                            // 2D-эффекты
  pic: null,                         // картинка уровня: центр и габариты в мире (с учётом сетки уровня)
  left: [],                          // сколько клеток каждой краски ещё не закрашено
  introAt: -9, score: 0, barU: 0, pixDone: 0, pixTotal: 0, hudKick: -9, dt: 0.016, combo: { n: 0, at: -9 },
  tickN: 0, lastTickT: 0, curInterval: CFG.stepInterval, nextTick: 0,
  spin: 0, tension: 0, tickSndAt: 0, hint: false,
  end: null,                         // сценарий конца уровня: { kind: 'win' | 'lose', r0, … }
  auto: null, botRng: null,
  peek: -1,                          // зажатая капелька: вид краски, чьи достижимые клетки подсвечены (−1 — нет)
  vibAt: 0,
};
const L = { n: 30, h: 1, cells: [], slots: [], queue: [] };     // раскладка уровня в мире; h — радиус клетки (5 / радиус кольца ленты)
const COL = { paint: [], paintDark: [], blank: [], paper: [1, 1, 1], secret: [0.7, 0.7, 0.9], secretDark: [0.2, 0.2, 0.4], white: [1, 1, 1] };   // цвета как [r, g, b] 0…1 (заполняет boot)

// --- игровые часы ---
const Clock = { base: 0, anchor: performance.now(), scale: 1, off: 0, stopUntil: 0 };
const realNow = () => performance.now() + Clock.off;            // off растёт только в ручном прогоне drive()
const clockScale = () => G.paused ? 0 : G.speed * G.slow;
function now(){
  const r = realNow();
  if (Clock.stopUntil && r >= Clock.stopUntil){                 // хит-стоп кончился ровно в свой срок
    Clock.base += (Clock.stopUntil - Clock.anchor) / 1000 * Clock.scale; Clock.anchor = Clock.stopUntil; Clock.scale = clockScale(); Clock.stopUntil = 0;
  }
  return Clock.base + (r - Clock.anchor) / 1000 * Clock.scale;
}
function reclock(){ const t = now(); Clock.base = t; Clock.anchor = realNow(); Clock.scale = clockScale() * (Clock.stopUntil ? CFG.hitStopScale : 1); }
function hitStop(ms){ const t = now(), r = realNow(); Clock.base = t; Clock.anchor = r; Clock.scale = clockScale() * CFG.hitStopScale; Clock.stopUntil = Math.max(Clock.stopUntil, r + ms / Math.max(0.1, G.speed)); }
function setSlow(s){ G.slow = s; reclock(); }

function log(kind, name, info){            // журнал [game] — одна строка на событие (§11)
  console.log('[game] ' + JSON.stringify({ t: +now().toFixed(3), kind, name, info: info === undefined ? '' : String(info) }));
}
Sfx.log = log; Sfx.muted = G.save.muted;
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function buzzDrop(){ const r = realNow(); if (r - G.vibAt < CFG.vibGapMs) return; G.vibAt = r; buzz(CFG.vib.drop); }

// --- математика ---
const SQ3 = Math.sqrt(3), TAU = Math.PI * 2;
const hexWorld = (q, r) => [1.5 * q * L.h, -SQ3 * (q / 2 + r) * L.h];   // как в веб-порте: Z ядра развёрнут на зрителя; L.h — радиус клетки уровня
const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
const mix = (a, b, u) => a + (b - a) * u;
const easeOut = (u) => 1 - Math.pow(1 - u, 3);
const easeIn = (u) => u * u * u;
const easeInOut = (u) => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeBack = (u) => { const c = 1.9, v = u - 1; return 1 + (c + 1) * v * v * v + c * v * v; };   // с перелётом
const spring = (s, f, d) => s < 0 ? 0 : Math.exp(-d * s) * Math.cos(f * s);     // затухающая пружина: 1 → 0 с перелётом
const fxRnd = mulberry32(4711);                                  // случайность эффектов — свой генератор с сидом (§5)
function hash01(n){ n = Math.imul(n ^ 0x9E3779B9, 0x85EBCA6B); n ^= n >>> 13; n = Math.imul(n, 0xC2B2AE35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
// Точка на ленте: клетки кольца ядра стоят на своих местах гекс-сетки, между ними — по прямой.
const ringPos = (fi) => { const n = L.n, i = Math.floor(fi), u = fi - i, a = L.cells[((i % n) + n) % n], b = L.cells[(((i + 1) % n) + n) % n]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; };
const hexCss = (c) => 'rgb(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ')';
const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

// ---------------------------------------------------------------------------
// Картинки: клетки уровня для 2D-превью (мини-картинка цели, галерея, улетающая картинка). Координаты — в клетках (радиус гекса 1).
// ---------------------------------------------------------------------------
const PICV = LEVELS.map((def) => {
  const cells = []; let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  const mm = paintMap(def);
  for (const row of def.c.concat(def.s || [])){ const q = row[0], r = row[1], x = 1.5 * q, z = -SQ3 * (q / 2 + r); cells.push({ k: K(q, r), x, z, kind: mm.get(row[2]) }); x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  return { name: def.n, cells, n: cells.length, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2, w: x1 - x0 + 2, h: z1 - z0 + SQ3 };
});
// Шестиугольник плоской стороной вверх: центр, радиус.
function hexPath(c, x, y, r){ c.beginPath(); for (let i = 0; i < 6; i++){ const a = i * Math.PI / 3; c[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } c.closePath(); }
// Картинка уровня li гексами в рамке boxW × boxH с центром (cx, cy). shown(cell) → закрашена ли клетка (нет — силуэт цвета ghost;
// функция не задана — закрашено всё).
function drawPic(c, li, cx, cy, boxW, boxH, shown, ghost){
  const P = PICV[li], s = Math.min(boxW / P.w, boxH / P.h);
  for (const cell of P.cells){
    c.fillStyle = (shown ? shown(cell) : true) ? PAL.paint[cell.kind] : ghost;
    hexPath(c, cx + (cell.x - P.cx) * s, cy + (cell.z - P.cz) * s, s * 1.06); c.fill();
  }
}
// Картинка на отдельном canvas (кнопка галереи, ячейка карточки победы): done — цветная, иначе силуэт.
function paintThumb(cv, li, done, ghost){
  const d = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 56, h = cv.clientHeight || 56;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
  drawPic(c, li, w / 2, h / 2, w * 0.86, h * 0.86, done ? null : () => false, ghost || PAL.ghost);
}

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
const isOpen = (li) => G.save.unlockAll || li <= G.save.level;
function setUnlockAll(on){ G.save.unlockAll = !!on; save(); log('event', 'cheat', 'unlockAll=' + G.save.unlockAll); }
function goto(screen){
  if ((screen === 'win' || screen === 'lose' || screen === 'game') && !G.st){ startLevel(G.save.level); if (screen === 'game') return; }
  G.screen = screen; log('screen', screen);
  const ov = $('overlay'), card = $('card'), end = $('end');
  ov.classList.toggle('show', screen === 'menu' || screen === 'help');
  end.classList.toggle('hide', screen !== 'win' && screen !== 'lose');
  $('revive').classList.toggle('hide', screen !== 'lose');
  if (screen !== 'win') $('flypic').classList.add('hide');
  if (screen === 'menu'){
    let lv = ''; const got = Object.keys(G.save.best).length;
    for (let i = 0; i < LEVELS.length; i++) lv += `<button data-act="lvl" data-li="${i}" class="${isOpen(i) ? '' : 'locked'}${G.save.best[i] ? ' done' : ''}"><canvas data-pic="${i}"></canvas><b>${isOpen(i) ? i + 1 : '🔒'}</b></button>`;
    card.innerHTML = `<h2>Раскраска · рост</h2><p>Тапни тюбик — он поедет по ленте вокруг холста, и краска прилипнет к краю закрашенного: картинка растёт от зерна в центре. Раскрась её всю.</p>
      <button class="primary" data-act="play">Играть · картинка ${Math.min(G.save.level, LEVELS.length - 1) + 1}</button> <button data-act="help">Как играть</button>
      <div class="levels">${lv}</div><p style="margin:0 0 4px;font-size:13px">Галерея: собрано ${got} из ${LEVELS.length}</p>
      ${G.save.unlockAll ? '<button class="cheat" data-act="relock">Чит включён · закрыть обратно</button>' : '<button class="cheat" data-act="unlock">Чит: открыть все уровни</button>'}
      <button class="cheat" data-act="wipe">Сбросить прогресс</button>
      <button class="cheat" data-act="mute">Звук: ${G.save.muted ? 'выкл' : 'вкл'}</button>`;
    for (const cv of card.querySelectorAll('canvas[data-pic]')) paintThumb(cv, +cv.dataset.pic, !!G.save.best[+cv.dataset.pic]);
  }
  if (screen === 'help') card.innerHTML = `<h2>Как играть</h2><p>Тюбик едет по ленте вокруг холста и выдавливает краску по прямой внутрь.
      Краска пролетает над пустыми клетками и прилипает к краю закрашенного — поэтому картинка растёт от готового зерна в центре.
      Красит только клетку своего цвета. Высокие клетки со светлой кромкой — край: туда краска попадёт сейчас. Зажми тюбик — замигают его клетки.
      Число на этикетке — сколько клеток он закрасит. Серые камни не красятся, но краска к ним липнет.
      Если до клетки уже не долететь (её обступили со всех сторон), краска затечёт в неё сама — из тюбика того же цвета.
      Проехал круг с остатком — встаёт на полку, мест пять, оттуда его можно отправить снова. Шестому встать некуда — проигрыш.
      Тюбик с пломбой «?» откроется, когда встанет первым.</p><button class="primary" data-act="menu">Понятно</button>`;
  if (screen === 'win'){
    let gal = ''; for (let i = 0; i < LEVELS.length; i++) gal += `<span class="${i === G.li ? 'now' : ''}" data-slot="${i}"><canvas data-pic="${i}"></canvas></span>`;
    end.innerHTML = `<h2>«${LEVELS[G.li].n}» готова!</h2><p>Картинка ${G.li + 1} из ${LEVELS.length} — в галерею</p><div class="gal">${gal}</div>
      <div class="reward"><img src="assets/ui/b-coins.png" alt=""><b id="win-coins">+${Math.round(G.score)}</b></div>
      <div class="row"><button class="primary" data-act="next">${G.li + 1 < LEVELS.length ? 'Дальше' : 'Сначала'}</button><button data-act="retry">Ещё раз</button></div>`;
    const fresh = G.end && G.end.kind === 'win' && !G.end.stamped;       // картинка этого уровня ещё летит в свою ячейку
    for (const cv of end.querySelectorAll('canvas[data-pic]')){ const i = +cv.dataset.pic; paintThumb(cv, i, !!G.save.best[i] && !(i === G.li && fresh), PAL.ghostDark); }
  }
  if (screen === 'lose') end.innerHTML = `<h2>Полка занята</h2><p>Шестому тюбику некуда встать</p>
      <div class="row"><button class="primary" data-act="retry">Заново</button><button data-act="menu">Меню</button></div>`;
  if (screen === 'lose') placeRevive();
}
function placeRevive(){ if (!R3.ready) return; const p = R3.project(0, 0.6, CFG.slotZ - 2.4); const b = $('revive'); b.style.left = p[0] + 'px'; b.style.top = p[1] + 'px'; }
$('frame').addEventListener('click', (e) => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; Sfx.init(); Sfx.ui(); log('input', 'button', act);
  if (act === 'play') startLevel(Math.min(G.save.level, LEVELS.length - 1));
  else if (act === 'retry') startLevel(G.li);
  else if (act === 'next') startLevel(G.li + 1 < LEVELS.length ? G.li + 1 : 0);
  else if (act === 'help') goto('help');
  else if (act === 'lvl'){ const li = +el.dataset.li; if (isOpen(li)) startLevel(li); else toast('Сначала собери картинку ' + (G.save.level + 1)); }
  else if (act === 'unlock' || act === 'relock'){ setUnlockAll(act === 'unlock'); goto('menu'); }
  else if (act === 'wipe'){ G.save = { level: 0, muted: G.save.muted, best: {}, unlockAll: false, coins: 0 }; save(); goto('menu'); }
  else if (act === 'revive') toast('Заглушка: здесь будет шестое место за рекламу');
  else if (act === 'mute'){ G.save.muted = !G.save.muted; Sfx.setMuted(G.save.muted); save(); goto('menu'); }
  else goto('menu');
});
window.addEventListener('hashchange', () => openHash(location.hash.slice(1)));
function openHash(h){
  if (h === 'unlock'){ setUnlockAll(true); goto('menu'); }
  else if (/^l\d+$/.test(h)) startLevel(Math.max(1, Math.min(LEVELS.length, +h.slice(1))) - 1);
  else if (h === 'game') startLevel(G.save.level);
  else goto(['menu', 'help', 'win', 'lose'].includes(h) ? h : 'menu');
}
let toastUntil = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.remove('hide'); toastUntil = performance.now() + CFG.toastMs; }
function hud(){ $('hud-level').textContent = 'Картинка ' + (G.li + 1); }

// ---------------------------------------------------------------------------
// Уровень
// ---------------------------------------------------------------------------
function startLevel(li){
  li = Math.max(0, Math.min(LEVELS.length - 1, li | 0));
  G.speed = G.speed || 1; G.slow = 1; reclock();
  const def = LEVELS[li], st = loadLevel(def), t = now();
  G.li = li; G.def = def; G.st = st; G.kinds = paintMap(def);
  L.h = 5 / st.ringR; L.n = st.ring.length; L.cells = st.ring.map((k) => hexWorld(...UNK(k)));
  L.slots = []; for (let i = 0; i < CFG.maxSlots; i++) L.slots.push([(i - (CFG.maxSlots - 1) / 2) * CFG.slotDX, CFG.slotZ]);
  L.queue = st.columns.map((col, c) => { const out = []; for (let r = 0; r <= CFG.queueRows; r++) out.push([(c - (st.columns.length - 1) / 2) * CFG.queueDX, CFG.queueZ + r * CFG.queueDZ]); return out; });
  const wells = [...st.field], wellOf = new Map(wells.map((k, i) => [k, i])), P = PICV[li], h = L.h;
  G.vp = new Map(); G.pixTotal = st.center.size + st.painted.size; G.pixDone = st.painted.size; G.left = CFG.paints.map(() => 0); G.stones = [];
  G.pic = { cx: P.cx * h, cz: P.cz * h, w: P.w * h, h: P.h * h };
  for (const [k, pile] of st.center){
    const [q, r] = UNK(k), [x, z] = hexWorld(q, r), kind = G.kinds.get(pile.layers[pile.layers.length - 1].color);
    G.left[kind]++;
    G.vp.set(k, { k, i: wellOf.get(k), q, r, x, z, kind, delay: 0.15 + Math.hypot(x, z) * CFG.introStep, state: 'tile', fillAt: -9, bumpAt: -9, doneAt: -9, flashAt: -9, lit: false, reach: false, reachAt: -9 });
  }
  for (const [k, color] of st.painted){                  // зерно: уже закрашено мокрой краской, падает на холст первым
    const [q, r] = UNK(k), [x, z] = hexWorld(q, r);
    G.vp.set(k, { k, i: wellOf.get(k), q, r, x, z, kind: G.kinds.get(color), delay: 0.05 + Math.hypot(x, z) * CFG.introStep * 0.6, state: 'pixel', seed: true, fillAt: -9, bumpAt: -9, doneAt: -9, flashAt: -9, lit: false, reach: false, reachAt: -9 });
  }
  for (const k of st.stones){ const [q, r] = UNK(k), [x, z] = hexWorld(q, r); G.stones.push({ k, x, z, delay: 0.1 + Math.hypot(x, z) * CFG.introStep, ph: hash01(q * 131 + r) }); }
  G.peek = -1; G.rays = null; updateReach(t, true);
  G.shots = []; G.fills = []; G.spray = []; G.wv = new Map(); G.gone = []; G.fx = []; G.puddles = []; G.caps = []; G.splats = [];
  G.score = 0; G.barU = 0; G.combo = { n: 0, at: -9 }; G.hudKick = -9;
  G.tickN = 0; G.lastTickT = t; G.curInterval = stepInterval(st); G.nextTick = t + G.curInterval;
  G.spin = 0; G.tension = 0; G.end = null;
  G.hint = li === 0; G.botRng = mulberry32(5000 + li);
  const tv = CFG.trackAp / Math.cos(Math.PI / 6) + 0.2, tw = CFG.trackAp + 0.25;
  R3.setGrid(L.h);
  R3.buildLevel({
    wells: wells.map(k => hexWorld(...UNK(k))), slots: L.slots,
    chev: L.cells.map((a, i) => { const b = L.cells[(i + 1) % L.n]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.atan2(-(b[0] - a[0]), -(b[1] - a[1]))]; }),
    bounds: [[-tw, 0, 0], [tw, 0, 0], [0, 2.4, -tv], [0, 0, CFG.queueZ + 2 * CFG.queueDZ + 0.75]],
  });
  R3.setPad(CFG.hudTopPx, CFG.barPx);
  syncCarriers(t, true);
  R3.warmUp(); R3.setVeil(0); R3.setRays(0, 0, 1, 0, 0);
  G.introAt = t; Sfx.cascade(st.center.size);
  log('event', 'level.start', 'level=' + (li + 1) + ' name=' + def.n + ' cells=' + st.center.size + ' seed=' + st.painted.size + ' stones=' + st.stones.size + ' ring=' + st.ringR + ' need=' + st.needed);
  goto('game'); hud();
}

// ---------------------------------------------------------------------------
// Капельки-перевозчики на экране. У каждого объекта ядра (элемент очереди или traveler) — свой вид W; при выходе на ленту
// вид переезжает с элемента очереди на traveler, так капелька остаётся той же самой.
// ---------------------------------------------------------------------------
function makeW(src, count){
  return { src, kind: G.kinds.get(src.color), secret: !!src.secret, n0: Math.max(1, count), mode: 'queue', place: '', x: 0, y: 0, z: 0, tx: 0, tz: 0, ph: fxRnd() * TAU,
           tw: null, jumpFrom: null, squashAt: -9, plopAt: -9, plopDone: true, shakeAt: -9, revealAt: -9, spitAt: -9, emit: 0, sxz: 1, sy: 1, burst: null, shots: 0,
           yaw: 0, yawV: 0, aimYaw: 0, aimUntil: -9, sqAt: -9, rl: 0, off: 0 };
}
function syncCarriers(t, instant){
  const st = G.st;
  for (let c = 0; c < st.columns.length; c++){
    const col = st.columns[c];
    for (let r = 0; r < Math.min(col.length, CFG.queueRows); r++){
      const obj = col[r], target = L.queue[c][r];
      let W = G.wv.get(obj);
      if (!W){ W = makeW(obj, obj.count); G.wv.set(obj, W); const from = L.queue[c][instant ? r : CFG.queueRows]; W.x = from[0]; W.z = from[1]; }
      const place = 'q' + c + ':' + r;
      if (W.place !== place){ if (!instant) W.tw = { x: W.x, y: W.y, z: W.z, t0: t, dur: CFG.queueShiftT, arc: 0 }; W.place = place; }
      W.mode = 'queue'; W.col = c; W.row = r; W.tx = target[0]; W.tz = target[1]; W.secret = !!obj.secret;
    }
  }
  for (let i = 0; i < st.slots.length; i++){
    const W = G.wv.get(st.slots[i]); if (!W) continue;
    const place = 's' + i;
    if (W.place !== place){ W.tw = { x: W.x, y: W.y, z: W.z, t0: t, dur: CFG.queueShiftT, arc: 0 }; W.place = place; }
    W.mode = 'slot'; W.slot = i; W.tx = L.slots[i][0]; W.tz = L.slots[i][1];
  }
  for (const trav of st.travelers){ const W = G.wv.get(trav); if (W){ W.mode = 'trav'; W.place = 't'; } }
}
// Где капелька на ленте: прыжок при въезде (сначала сжатие на месте), иначе — между клетками, с подскоком на каждом шаге.
const TP = [0, 0, 0];
function travPos(trav, W, t){
  if (trav.entering){

// ---------------------------------------------------------------------------
// События ядра → предметы на экране, звук, вибрация, журнал

        G.shots.push({ W, kind: vp.kind, vp, k: e.target, bx: b[0], bz: b[1], t0, t1: t0 + e.dist * CFG.chipSeg * CFG.shotSpeed, P0: null,

function tapColumn(c){

  const fronts = st.columns.map(col => col[0]), t = now(), res = deployColumn(st, c, t);
  if (!res) return false;
  if (res.rejected){ rejectTap(res, fronts[c], t); return false; }
  G.hint = false;
  for (const e of res.ev) if (e.kind === 'deploy'){ const W = G.wv.get(fronts[e.col]); if (W){ G.wv.delete(fronts[e.col]); W.src = e.trav; G.wv.set(e.trav, W); } }
  onEvents(res.ev, t); syncCarriers(t);

}
function tapSlot(i){
  const st = G.st; if (!st || st.ended || G.screen !== 'game') return false;
  const t = now(), trav = st.slots[i], res = relaunchSlot(st, i, t);

}

  toast(res.rejected === 'buried' ? 'Тюбики на верёвочке выходят вместе — второе ещё не первое' : 'На ленте уже ' + st.capacity + ' — подожди');
  log('event', 'reject', res.rejected);

// ---------------------------------------------------------------------------
// Капля краски: полёт от капельки к клетке. Вылетела из макушки к клетке входа → летит дугой строго по прямой гекса → шлёпается
// в клетку, и краска разливается по ней. Клетка открывает луч в момент посадки капли (контракт ядра).
// ---------------------------------------------------------------------------
function startShot(c){
  const W = c.W;

    c.P0 = tubePoint(W, R3.TUBE.capX1, R3.TUBE.axisY, 0);
    W.emit = Math.max(0, W.emit - 1); W.spitAt = c.t0; W.sqAt = c.t0; Sfx.squirt(W.kind, W.shots % 10);
  } else c.P0 = c.seal ? [c.vp.x, 1.6, c.vp.z] : [c.bx * 1.25, 1.5, c.bz * 1.25];
  if (c.seal){ c.bx = c.P0[0]; c.bz = c.P0[2]; }
}
const SPOS = [0, 0, 0];
function shotPos(c, t){
  const T = c.t1 - c.t0, u = clamp01((t - c.t0) / T), uA = Math.min(CFG.popT, T * 0.4) / T;
  const Dx = c.vp.x, Dz = c.vp.z, Dy = cellTopY(), len = Math.hypot(Dx - c.bx, Dz - c.bz);
  if (u < uA){ const e = u / uA; SPOS[0] = mix(c.P0[0], c.bx, e); SPOS[2] = mix(c.P0[2], c.bz, e); }
  else { const e = (u - uA) / (1 - uA); SPOS[0] = mix(c.bx, Dx, e); SPOS[2] = mix(c.bz, Dz, e); }

}
const cellTopY = () => CFG.tileH * L.h * (!CFG.rise ? 1 : CFG.well ? CFG.wellH : CFG.flatReach);      // куда шлёпается краска: верх незакрашенной клетки

// Рубеж: какие незакрашенные клетки краска уже может достать — то же правило, что у ядра (scanTarget), но по экрану: клетка становится
// краем, когда на неё легла краска. Краска пролетает над пустыми клетками и липнет перед первой закрашенной (или камнем) на луче.
// Лучи (клетки поля по прямой от каждой клетки ленты в каждую сторону: клетка картинки, камень или пустое место) строятся один раз на уровень.
const STONE = { stone: true };
function buildRays(){

  for (const rk of st.ring){ const [rq, rr] = UNK(rk);
    for (const [dq, dr] of DIRS){ let q = rq, r = rr; const ray = []; let any = false;
      for (let s = 0; s < maxScan; s++){ q += dq; r += dr; const k = K(q, r); if (!st.field.has(k)){ if (any) break; continue; }
        const e = G.vp.get(k) || (stones.has(k) ? STONE : null); ray.push(e); if (e) any = true; }

    for (const e of ray){

      last = e && e !== STONE ? e : null;

// Клетка закрашена: легла плоским пикселем. Соседи чуть подпрыгивают; закрашен весь цвет — по его пикселям бежит вспышка.

function addGlints(x, y, z, n, col){ const t = now(); for (let k = 0; k < n; k++) G.fx.push({ type: 'glint', x: x + (fxRnd() - 0.5) * 1.6, y: y + fxRnd() * 0.8, z: z + (fxRnd() - 0.5), t0: t + k * 0.05, dur: 0.3, size: 0.45, col: col || '#ffffff' }); }

// ---------------------------------------------------------------------------
// Шаг игры: посадки капель, заливки, перевороты, тики ленты, бот. Конец уровня — по состоянию в кадре
// (урок lesson-ending-after-return-anim): победа начинается, когда ядро выиграло И последний пиксель лёг на место.
// ---------------------------------------------------------------------------
function advance(t){
  const st = G.st; if (!st) return;
  for (let i = G.shots.length - 1; i >= 0; i--){ const c = G.shots[i]; if (t >= c.t1){ G.shots.splice(i, 1); shotArrived(c, t); } }
  for (let i = G.fills.length - 1; i >= 0; i--){ const vp = G.fills[i]; if (t >= vp.fillAt + fillDur(vp)){ G.fills.splice(i, 1); finishFill(vp, t); } }
  if (!st.ended){
    const land = landTravelers(st, t); if (land.length) onEvents(land, t);
    let guard = 0;
    while (t >= G.nextTick && guard++ < 8 && !st.ended){
      const te = G.nextTick;
      if (G.auto && st.travelers.length < st.capacity) botMove();
      const ev = step(st, te);
      G.tickN++; G.lastTickT = te; G.curInterval = stepInterval(st); G.nextTick = te + G.curInterval;
      for (const e of ev) if (e.kind === 'deposit') e.lead = true;
      if (ev.length) onEvents(ev, te);
    }
    if (guard >= 8) G.nextTick = t + G.curInterval;
    syncCarriers(t);
  }
  if (!G.end){
    if (st.ended === 'lose') startLose(t);
    else if (st.ended === 'win' && !G.shots.length && !G.fills.length) startWin(t);

}

  const st = G.st, act = (G.auto === 'dumb' ? dumbAction : G.auto === 'random' ? randomAct : greedyAction)(st, G.botRng);
  if (!act) return;
  if (act.kind === 'column') tapColumn(act.i); else tapSlot(act.i);
}

// ---------------------------------------------------------------------------
// Финал: картинка готова. Камера наезжает, картинка приподнимается над притемнённым холстом, по пикселям от центра бежит
// волна со звоном → вспышка, лучи, салют красками и название → карточка: картинка улетает в свою ячейку галереи, награда набегает.
// ---------------------------------------------------------------------------
const seqT = () => (realNow() - G.end.r0) / 1000 * G.speed;      // время сценария: реальные секунды (замедление часов на него не действует)
function startWin(t){
  const P = G.pic; let maxR = 0;
  for (const vp of G.vp.values()){ vp.wr = Math.hypot(vp.x - P.cx, vp.z - P.cz); maxR = Math.max(maxR, vp.wr); }
  const E = G.end = { kind: 'win', r0: realNow(), step: 0, wave: 0, rain: 0, f: 0, s: 0, flashS: 1e9, cardS: 1e9, stamped: false };
  E.flashAt = CFG.winWaveAt + maxR * CFG.winWavePer + 0.22;
  R3.setFocus(P.cx, CFG.winLift, P.cz, Math.max(P.w / 2 + 1.2, 8.75 / CFG.winZoomMax), P.h / 2 * R3.SP() + 1.2, CFG.winPadTop, CFG.winPadBottom);
  log('event', 'level.win', 'cells=' + G.pixDone); log('fx.start', 'finale');
}
function confetti(x, y, z, vx, vy, vz, t, life){
  const cells = PICV[G.li].cells, kind = cells[Math.floor(fxRnd() * cells.length)].kind, dark = CFG.paints[kind].id === 'K' || CFG.paints[kind].id === 'U';
  G.spray.push({ x, y, z, vx, vy, vz, r: 0.17 + fxRnd() * 0.13, col: dark ? COL.white : COL.paint[kind], t0: t, life: life || 2.2, floor: 0.12 });
}

    E.step = 1; E.flashS = s; Sfx.winFlash(); buzz(CFG.vib.win); log('fx.start', 'win.flash', LEVELS[G.li].n);

    G.fx.push({ type: 'ring', x: P.cx, y, z: P.cz, t0: t, dur: 0.6, r0: 1, r1: P.w * 0.9, col: '#ffffff', a: 1 });
    for (let k = 0; k < 10; k++){ const a = k / 10 * TAU; G.fx.push({ type: 'glint', x: P.cx + Math.cos(a) * (P.w / 2 + 0.6), y, z: P.cz + Math.sin(a) * (P.h / 2 + 0.4), t0: t + 0.08 + fxRnd() * 0.5, dur: 0.45, size: 0.8, col: '#ffffff' }); }
  }
  if (E.step === 1 && s >= E.flashAt + CFG.winCardAfter){ E.step = 6; E.cardS = s;
    const sc = Math.round(G.score) + CFG.winBonus; G.score = sc; G.save.best[G.li] = Math.max(G.save.best[G.li] || 0, sc); G.save.coins = (G.save.coins || 0) + sc; G.save.level = Math.max(G.save.level, Math.min(G.li + 1, LEVELS.length - 1)); save();
    log('fx.end', 'finale'); log('event', 'reward', 'coins=' + sc); goto('win'); E.countR0 = realNow(); E.tickAt = 0; startGalleryFly(); }

    const u = clamp01((realNow() - E.countR0) / 1000 * G.speed / CFG.winCountT), el = $('win-coins');

// Картинка улетает в галерею: уменьшенная копия летит от холста к своей ячейке в карточке победы и встаёт туда со штампом.
function startGalleryFly(){
